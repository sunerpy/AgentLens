version: 0.2

# ===========================================================================
# AgentLens — tier-2 E2E FEASIBILITY PROBE (not a gate, not a verification)
# ---------------------------------------------------------------------------
# Run with:
#   aws codebuild start-build --project-name agentlens-linux \
#     --buildspec-override .aws/buildspec/linux-e2e-real-probe.yml \
#     --region us-east-2 --profile us
#
# WHY THIS FILE EXISTS
#   `npm run test:e2e:real` (WebdriverIO, 8 specs) drives the REAL Tauri WebView
#   through tauri-driver -> WebKitWebDriver. It has never run on any cloud CI, and
#   "we never tried" is not an acceptable reason to leave a tier of tests unproven.
#   This file tries it ONCE, end to end, so the blocker is a measured log line
#   instead of a guess. Its FAILED status is a finding, not a regression — that is
#   why it is a separate, explicitly-named probe file and NOT a gate inside
#   linux.yml. Do not add it to a pipeline.
#
# TWO BLOCKERS WERE POSTULATED GOING IN. THE PROBE HAS NOW RUN, AND THE RESULT IS
# NOT WHAT THE LOCAL EXPERIENCE PREDICTED. Measured on us-east-2,
# agentlens-linux:d1f2621d-e9a1-4f25-b62e-6e98eda7bf0e:
#
#   Spec Files: 5 passed, 3 failed, 8 total (100% completed) in 00:06:40
#
#   B1  WebKitWebDriver hanging on POST /session — DOES NOT REPRODUCE HERE.
#       Locally (Arch, webkitgtk-6.0) tauri-driver forwards the session request
#       and the native driver never answers, even for a bare curl with minimal
#       capabilities. In this container the session is created in ~1.1 s, the
#       real Tauri WebView boots (`wry 0.55.1 linux`), and real IPC answers:
#       `window.__TAURI_INTERNALS__.invoke('get_settings')` returns a value.
#       00-smoke, 30-geometry, 40-scope, 60-threshold and 90-tray all PASS
#       against the real driver. So the driver path is a LOCAL environment
#       problem, not a CI one.
#
#   B2  The specs assert on the OPERATOR'S DATA — CONFIRMED, and it is now the
#       only thing left. All 3 failures (10-flow, 50-rootcause, 87-firstrun)
#       trace to one runtime fact:
#         lastError: 'OpenCode database was not found; probed paths:
#           [/tmp/agentlens-probe-xdg/opencode/opencode.db,
#            /root/.local/share/opencode/opencode.db]'
#       so nothing is ever archived and `expect(archived).toBeGreaterThan(0)`
#       fails. Fabricating that DB is a separate piece of work (a synthetic
#       fixture with a known row count) and must NOT be smuggled in under "make
#       CI green" — hence tier 2 stays out of linux.yml.
#
#   B3  NEW, found by running it: the harness writes screenshots under
#       `.omo/evidence/f3-agentlens-usage-dashboard/screenshots`, and `.omo/` is
#       excluded from the S3 source zip, so one spec additionally dies with
#       "directory (...) doesn't exist". `AGENTLENS_WDIO_EVIDENCE` already exists
#       as the seam to redirect it; a future fixture-based gate must set it.
#
# NO `|| true`, no `continue-on-error`. Every step is a hard assertion, because a
# probe that swallows its own failure teaches nothing.
# ===========================================================================

env:
  variables:
    CARGO_TERM_COLOR: "always"
    RUST_BACKTRACE: "1"
    NODE_VERSION: "22.14.0"
    # The X display Xvfb serves and every later phase must re-export (CodeBuild
    # does not carry shell exports across phases — the container, and therefore a
    # backgrounded Xvfb/vite process, does survive).
    PROBE_DISPLAY: ":99"
    # Keep the operator's real archive out of reach even in the failure paths.
    XDG_DATA_HOME: "/tmp/agentlens-probe-xdg"

phases:
  install:
    commands:
      - 'echo "=== apt: Tauri 2 stack + WebKitWebDriver + Xvfb ==="'
      - apt-get update
      # webkit2gtk-driver provides /usr/bin/WebKitWebDriver, which tauri-driver
      # spawns. xvfb provides the X display the real WebView needs (unlike
      # Playwright's headless Chromium, wry has no headless mode).
      - >-
        apt-get install -y --no-install-recommends
        build-essential pkg-config libssl-dev
        libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
        libgtk-3-dev librsvg2-dev patchelf
        libayatana-appindicator3-dev
        webkit2gtk-driver xvfb
        curl file unzip xz-utils
      # NO `--version` here: WebKitWebDriver has no such flag and answers with its
      # usage text and exit status 1 (measured — it killed the probe's first run
      # in INSTALL). `command -v` plus the package version below is the honest
      # presence check.
      - 'echo "=== WebKitWebDriver presence (B1 starts here) ==="'
      - command -v WebKitWebDriver
      - dpkg-query -W -f='${Package} ${Version}\n' webkit2gtk-driver
      - 'echo "=== node (pinned $NODE_VERSION) ==="'
      - curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
      - mkdir -p /usr/local/node && tar -xJf /tmp/node.tar.xz -C /usr/local/node --strip-components=1
      - export PATH="/usr/local/node/bin:$PATH"
      - node --version && npm --version
      - 'echo "=== rust stable (evict the stale registry first) ==="'
      - rm -rf $HOME/.cargo/registry $HOME/.cargo/config.toml
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustc --version && cargo --version
      - 'echo "=== tauri-driver (the WebDriver shim wdio.conf.mjs spawns) ==="'
      - cargo install tauri-driver --locked
      - command -v tauri-driver

  pre_build:
    commands:
      - export PATH="$HOME/.cargo/bin:/usr/local/node/bin:$PATH"
      - 'echo "=== frontend deps ==="'
      - npm --prefix frontend ci
      # wdio.conf.mjs throws immediately unless target/debug/agentlens-tauri
      # exists, and the DEBUG binary is the one it drives (release would need a
      # different devUrl story). This is the single most expensive step here.
      - 'echo "=== debug binary (wdio.conf.mjs hard-requires target/debug) ==="'
      - cargo build -p agentlens-tauri
      - test -x target/debug/agentlens-tauri
      - ls -l target/debug/agentlens-tauri
      - 'echo "=== Xvfb on $PROBE_DISPLAY ==="'
      - |
        set -e
        Xvfb "$PROBE_DISPLAY" -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
        sleep 3
        export DISPLAY="$PROBE_DISPLAY"
        xdpyinfo -display "$PROBE_DISPLAY" >/dev/null 2>/tmp/xdpyinfo.err || {
          echo "Xvfb did not come up on $PROBE_DISPLAY"; cat /tmp/xvfb.log; cat /tmp/xdpyinfo.err; exit 1; }
        echo "Xvfb serving $PROBE_DISPLAY"
      # The debug binary loads its UI from build.devUrl (http://localhost:1420),
      # so vite dev must already be listening. wdio does NOT start it (a server
      # inheriting wdio's stdout wedges the runner), so it is backgrounded here
      # and the loop below is a HARD wait — the final curl has no `|| true`.
      - 'echo "=== vite dev on 1420 (devUrl the debug binary loads) ==="'
      - |
        set -e
        nohup npm --prefix frontend run dev >/tmp/vite.log 2>&1 &
        i=0
        while [ "$i" -lt 60 ]; do
          if curl -fsS -o /dev/null http://localhost:1420/; then break; fi
          i=$((i + 1))
          sleep 2
        done
        curl -fsS -o /dev/null http://localhost:1420/
        echo "vite dev is serving 1420"

  build:
    commands:
      - export PATH="$HOME/.cargo/bin:/usr/local/node/bin:$PATH"
      - export DISPLAY="$PROBE_DISPLAY"
      # `make test-e2e-real` == `npm --prefix frontend run test:e2e:real`, the
      # same target a developer runs. Nothing about the harness is re-implemented
      # here, so whatever fails is the harness's real behaviour in a container.
      - 'echo "=== PROBE: make test-e2e-real (8 wdio specs, real WebView) ==="'
      - make test-e2e-real

  post_build:
    commands:
      # These run whether the probe passed or failed, and they are the whole
      # point: tauri-driver.log carries the WebKitWebDriver side of a hung
      # POST /session, which the wdio output alone does not show.
      - 'echo "=== tauri-driver log ==="'
      - cat .omo/evidence/f3-agentlens-usage-dashboard/tauri-driver.log
      - 'echo "=== vite log (tail) ==="'
      - tail -40 /tmp/vite.log
      - 'echo "=== Xvfb log (tail) ==="'
      - tail -40 /tmp/xvfb.log
      - 'echo "probe complete — read the stage names above, not the build status"'
