version: 0.2

# ===========================================================================
# AgentLens — Windows MSVC gate + NSIS installer (CodeBuild WINDOWS container)
# ---------------------------------------------------------------------------
# Project     : agentlens-windows
# Image       : aws/codebuild/windows-base:2022-1.0
# Env type    : WINDOWS_SERVER_2022_CONTAINER
# Compute     : BUILD_GENERAL1_2XLARGE  (on-demand; NO fleet needed at 2XLARGE,
#               same as the sibling `workkit-windows`. Only smaller Windows
#               compute types require a reserved fleet.)
# Source      : S3 zip (this repo has NO git remote yet — see .aws/README.md)
# Timeout     : >= 120 minutes (VS BuildTools install alone costs several)
#
# WHY THIS FILE EXISTS
#   Windows packaging for AgentLens has NEVER actually been built — the release
#   workflow was only static-checked with actionlint. This buildspec is the
#   first real Windows gate: MSVC compile, `cargo test --workspace` on Windows,
#   and the NSIS installer through the committed bundle overlay.
#
# CONTAINS NO ACCOUNT-SPECIFIC DATA (no account IDs, bucket names, role ARNs).
#
# ---------------------------------------------------------------------------
# THREE MEASURED CodeBuild-Windows DEFECTS THIS FILE WORKS AROUND
#
# (A) ONE SHELL PER LIST ITEM.
#     CodeBuild runs EACH buildspec list item in its OWN PowerShell process, so
#     `$env:PATH = ...` set in one item is GONE in the next ("cargo is not
#     recognized"). => everything lives in ONE multi-line block.
#     [measured in codegraph-rust/.aws/buildspec/windows.yml]
#
# (B) SINGLE PHASE ONLY.
#     BETWEEN phases CodeBuild serializes the PowerShell session to env.xml and
#     restores it with Set-Variable, which throws
#       "Cannot overwrite variable ExecutionContext because it is read-only"
#     — a CodeBuild defect re-importing automatic variables. => use ONE phase so
#     there is no inter-phase save/restore at all.
#     [measured in noor/.aws/buildspec/windows.yml]
#
# (C) THE PREINSTALLED RUST IS A CHOCOLATEY SHIM.
#     The image's rustc/cargo/rustup are shims in C:\ProgramData\chocolatey\bin.
#     Deleting the user .cargo/.rustup dirs does NOT remove them, and filtering
#     PATH on '\.cargo'/'\.rustup' does NOT drop the chocolatey segment, so the
#     stale toolchain keeps winning. => (1) DELETE the chocolatey rust shim exes,
#     (2) filter any 'chocolatey' PATH segment out, (3) install fresh rustup into
#     C:\cargo / C:\rustup and prepend C:\cargo\bin.
#     [measured in codegraph-rust/.aws/buildspec/windows.yml]
#
# PLUS TWO MORE IMAGE FACTS
#
# (D) NO C++ WORKLOAD. The image ships VS Build Tools 2019 WITHOUT "Desktop
#     development with C++": no MSVC v143, no Windows SDK. rustc emits MSVC-style
#     link args but the only `link.exe` on PATH is the GNU coreutils `link` at
#     C:\tools\msys64\usr\bin, which fails with "link: extra operand". => install
#     visualstudio2022buildtools + visualstudio2022-workload-vctools via choco,
#     then import vcvars64.bat (see defect H for why NOT the dev shell), and DROP
#     msys64 / Git usr\bin / mingw from PATH so the MSVC link.exe cannot be
#     shadowed.
#     [measured in noor/.aws/buildspec/windows.yml]
#
# (E) MAX_PATH. Tauri/MSVC/cargo output paths exceed 260 chars. Enable long paths
#     for git AND the kernel before building.
#
# (F) NATIVE EXIT CODES DO NOT FAIL A ONE-BLOCK POWERSHELL SCRIPT.  <-- MEASURED
#     `$ErrorActionPreference = "Stop"` only terminates on *cmdlet* errors. A
#     native process that exits non-zero (cargo, npm, choco) does NOT throw, so
#     in the single-block layout defect (A)/(B) force on us, a FAILING GATE IS
#     SILENTLY SWALLOWED and the block's exit code is whatever the LAST command
#     returned. The reference buildspecs never hit this because they put one
#     command per list item and let CodeBuild check each item's exit code — an
#     option we do not have here. => every native gate is followed by
#     `Assert-Ok`, which throws on a non-zero $LASTEXITCODE. The deliberate
#     `cargo fmt` break (see .omo/evidence/aws-aw3-windows.md) is the negative
#     control that proves this actually fails the build.
#
# (G) THE POWERSHELL BODY MUST BE PURE ASCII.  <-- MEASURED, cost 3 iterations
#     CodeBuild materialises the command for Windows PowerShell 5.1, which reads
#     it as ANSI, NOT UTF-8. A single U+2014 em dash inside a double-quoted
#     string therefore decodes to 3 stray bytes, terminates the string early and
#     produces:
#       UnexpectedToken: Unexpected token 'the' in expression or statement.
#       MissingEndCurlyBrace: Missing closing '}' in statement block ...
#     A parse error means NO statement runs, so the phase fails in ~1 second
#     with EXIT 1 AND ZERO OUTPUT -- no error text reaches CloudWatch, which is
#     what makes it expensive to diagnose. Confirmed by feeding this very block
#     to [Parser]::ParseFile under 5.1 on the image (build 3fd49efb).
#     PS 7 on Linux parses the same text cleanly, so a local `pwsh` parse check
#     does NOT catch it -- assert ASCII instead:
#       python3 -c 'import yaml;s=yaml.safe_load(open(".aws/buildspec/windows.yml"))["phases"]["build"]["commands"][0];assert all(ord(c)<128 for c in s)'
#     Keep every line below, comments included, ASCII-only.
#
# (H) A LEAKED `$ErrorActionPreference = "Stop"` HANGS UPLOAD_ARTIFACTS FOR THE
#     FULL TIMEOUT.  <-- MEASURED; cost two ~99-minute TIMED_OUT builds
#     Defect (B) is broader than "between phases": CodeBuild ALSO restores the
#     serialized session before expanding the artifact base directory, with
#       Import-Clixml env.xml | %{ Set-Variable -WhatIf:$false $_.Name $_.Value } 2> $null
#     env.xml always carries the automatic variable ExecutionContext, so that
#     Set-Variable always errors -- harmlessly, because the error is
#     non-terminating and swallowed by `2> $null`. But env.xml ALSO carries our
#     own $ErrorActionPreference, and once "Stop" is restored the very same
#     error becomes TERMINATING and kills CodeBuild's restore script:
#       Error setting CODEBUILD_CONFIG environment variables: exit status 1
#       Unable to expand base directory: Set-Variable : Cannot overwrite
#       variable ExecutionContext because it is read-only or constant.
#     BUILD reports SUCCEEDED (the installer really was produced), then
#     UPLOAD_ARTIFACTS never recovers and burns the whole 120-minute timeout.
#     PROVED by a paired control, identical 3-line scripts differing only in the
#     trailing reset: build efa8b832 (no reset) hung in UPLOAD_ARTIFACTS until
#     stopped; build 73b8ac8b (reset to "Continue") uploaded in 5 seconds.
#     => the entire body runs inside `try { } finally { $ErrorActionPreference =
#     "Continue" }` so the leak is cleared on BOTH the success and the failure
#     path -- a failing gate must fail in seconds, not time out.
#     Corollary: prefer plain `$env:` mutation over anything that adds session
#     state, which is why vcvars64.bat is imported instead of Enter-VsDevShell.
#
# (I) ARTIFACT base-directory MUST BE THE OUTPUT DIR, NOT THE REPO ROOT.
#     With `base-directory: .` CodeBuild walks the entire tree -- including the
#     multi-GB `target/` -- twice (once for artifacts, once for report
#     auto-discovery). Point it at artifacts\dist so the walk is 3 files.
#
# ---------------------------------------------------------------------------
# SIDECAR STAGING (why zig appears in a Windows build)
#   src-tauri/tauri.bundle.windows.json (committed, NOT owned by this file)
#   declares:
#     externalBin: agentlens-askpass          -> Tauri resolves it as
#                                                agentlens-askpass-<triple>.exe
#     resources  : agentlens-collector-x86_64-unknown-linux-musl
#                  agentlens-collector-aarch64-unknown-linux-musl
#                  collectors.sha256          -> copied verbatim into $INSTDIR
#   The collectors are deliberately LINUX musl binaries even in the Windows
#   installer: the remote hosts AgentLens manages are Linux, the Windows app is
#   only the operator's console. `cargo tauri build` refuses to bundle with a
#   missing externalBin/resource (ResourcePathNotFound), so we must materialise
#   real Linux musl binaries on a Windows host. Windows has neither musl-gcc nor
#   an aarch64 musl cc, so we cross-compile with `cargo-zigbuild` (zig ships its
#   own musl sysroot for every target). This is the ONLY reason zig is installed.
#
#   AW3 alternative if zigbuild proves flaky: have the Linux project publish the
#   two collectors and feed them in as a second input artifact — but that pins
#   Windows behind Linux, which is why the self-contained path is the default.
#
# SCOPE NOTE — FRONTEND GATE PARITY (revised; see .aws/README.md "parity")
#   This file DOES run the same frontend gates as linux.yml and
#   .github/workflows/ci.yml: format:check, lint, typecheck, check-i18n.mjs,
#   test:unit and `npm run build`. It previously skipped them "because Linux owns
#   the platform-neutral gates", which made the buildspec a STRICT SUBSET of the
#   workflow it is supposed to be the proven source for. A workflow step that no
#   buildspec ever executed is unproven, so the subset had to go.
#   `npm run build` was always here anyway, because Tauri's beforeBuildCommand
#   needs frontend/dist to exist.
#
#   Still deliberately NOT here, each for a stated reason (NOT silent omission):
#     - oxfmt (YAML/JSON/Markdown formatting, part of `make fmt-check`): it reads
#       platform-neutral bytes, so a second and third opinion adds no signal.
#       ci.yml makes the same call — oxfmt is Linux-only there too.
#     - `make coverage-gate`: one coverage number per commit, or the Codecov
#       figure double-counts. Linux-only in ci.yml as well.
#     - `make dist` / `make dist-all`: Linux packaging. This platform ships NSIS.
#     - `make <anything>` at all: GNU make is not guaranteed on this image, which
#       is exactly why ci.yml also drops to bare npm/cargo on Windows.
#     - the ts-rs bindings drift gate
#       (`cargo test -p agentlens-tauri --features ts-export bindings_export`
#        + `git status --porcelain -- frontend/src/generated/`): it CANNOT be
#       meaningful here. The S3 source zip carries no `.git/` (see
#       .aws/README.md), so the drift comparison degrades to "the export ran",
#       and the export half costs a full feature-flagged rebuild of
#       agentlens-tauri on the slowest of the three platforms. Linux already
#       proves the export, and ci.yml under actions/checkout is where the drift
#       half becomes real.
#   E2E (Playwright / wdio) is out of scope: deferred to the E2E worker (AW5).
#
# IGNORED TESTS: plain `cargo test --workspace` skips the `#[ignore]` cases
#   (they need the operator's live ~43 GB archive DB or a real OS keyring).
#   NEVER add --ignored / --include-ignored to a CI gate.
#
# (J) THE agentlens-tauri TEST EXE DID NOT LOAD AT ALL. <-- MEASURED (F5)
#     Every one of the crate's 32 tests silently never ran; cargo reported exit
#       -1073741511 = 0xc0000139 = STATUS_ENTRYPOINT_NOT_FOUND
#     i.e. the loader rejected the harness BEFORE main. Diagnosed by diffing the
#     exe's dumpbin /IMPORTS against each DLL's dumpbin /EXPORTS on this image:
#     exactly ONE symbol was missing -- comctl32!TaskDialogIndirect (advapi32,
#     bcryptprimitives, dwmapi, gdi32, kernel32, ntdll, ole32, oleaut32,
#     shell32, user32, userenv, vcruntime140 all resolved; WebView2 is not even
#     a static dependency, and the keyring Cred*W imports DO resolve).
#     TaskDialogIndirect (used by tauri-runtime-wry + muda) is Common-Controls
#     v6 only; System32\comctl32.dll is v5.82. v6 is chosen per process by the
#     app manifest, which tauri-build attaches via embed_resource's
#     `cargo:rustc-link-arg-bins` -- BINS ONLY, so the test harness has none.
#     Not image-specific: any Windows host behaves this way.
#     FIX (src-tauri/build.rs): delay-load comctl32.dll for every linkable unit,
#     so the harness loads and the shipped binary still resolves v6 on first use
#     through its manifest. The gate below stays a plain `cargo test
#     --workspace` -- no feature juggling, no test excluded.
# ===========================================================================

env:
  variables:
    CARGO_TERM_COLOR: "always"
    RUST_BACKTRACE: "1"
    # Custom homes so the fresh toolchain cannot collide with the shim (defect C)
    RUSTUP_HOME: "C:\\rustup"
    CARGO_HOME: "C:\\cargo"
    # Pinned Node — frontend is on Vite 8 / Vitest 4 / TS 6 (needs >= 20.19)
    NODE_VERSION: "22.14.0"
    # Pinned zig — musl cross compiler for the collector sidecars
    ZIG_VERSION: "0.14.0"

phases:
  # SINGLE PHASE — see defect (B). Do not split this into install/pre_build/build.
  build:
    commands:
      - |
        $ErrorActionPreference = "Stop"
        # try/finally, NOT reindented on purpose: the finally clears the
        # $ErrorActionPreference leak that otherwise hangs UPLOAD_ARTIFACTS for the
        # full timeout (defect H), on the failure path as well as the success path.
        try {
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        # ---- helper: make a non-zero native exit FAIL the build (defect F) ----
        function Assert-Ok([string]$what) {
          if ($LASTEXITCODE -ne 0) {
            throw "GATE FAILED: $what exited with code $LASTEXITCODE"
          }
          Write-Host "gate ok: $what"
        }

        # ---- helper: the ONLY PATH we ever trust -------------------------
        # Prepends our fresh toolchains and evicts every segment that could
        # shadow them: the chocolatey rust shims (defect C) and the GNU
        # link.exe / mingw toolchains (defect D).
        function Set-BuildPath {
          $keep = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch '\.cargo'   -and `
            $_ -notmatch '\.rustup'  -and `
            $_ -notmatch 'chocolatey'-and `
            $_ -notmatch 'msys64'    -and `
            $_ -notmatch 'Git\\usr\\bin' -and `
            $_ -notmatch 'Git\\mingw'    -and `
            $_ -notmatch 'mingw64'
          }) -join ';'
          $env:PATH = "C:\cargo\bin;C:\node;C:\zig;" + $keep
        }

        Write-Host "=== [0/9] preinstalled rust BEFORE cleanup (expect chocolatey shims) ==="
        Get-Command rustc,cargo,rustup -ErrorAction SilentlyContinue |
          Select-Object Name,Source | Format-Table -AutoSize | Out-String | Write-Host

        Write-Host "=== [1/9] delete chocolatey rust shims (defect C) ==="
        Remove-Item -Force `
          "C:\ProgramData\chocolatey\bin\rustc.exe", `
          "C:\ProgramData\chocolatey\bin\cargo.exe", `
          "C:\ProgramData\chocolatey\bin\rustup.exe", `
          "C:\ProgramData\chocolatey\bin\rustfmt.exe", `
          "C:\ProgramData\chocolatey\bin\cargo-clippy.exe", `
          "C:\ProgramData\chocolatey\bin\clippy-driver.exe" `
          -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force `
          "C:\Users\ContainerAdministrator\.cargo", "C:\Users\ContainerAdministrator\.rustup", `
          "C:\Users\ContainerUser\.cargo", "C:\Users\ContainerUser\.rustup", `
          "C:\tools\rust", "C:\tools\.cargo", "C:\tools\.rustup" `
          -ErrorAction SilentlyContinue

        Write-Host "=== [2/9] long paths for git + kernel (defect E) ==="
        git config --global core.longpaths true
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
          -Name "LongPathsEnabled" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

        Write-Host "=== [3/9] VS2022 Build Tools + C++ (vctools) workload (defect D) ==="
        # The base image has VS2019 WITHOUT the C++ workload, so there is no MSVC
        # link.exe at all. Multi-GB, several minutes -- unavoidable.
        choco install -y --no-progress visualstudio2022buildtools
        choco install -y --no-progress visualstudio2022-workload-vctools
        Write-Host "choco exit: $LASTEXITCODE"

        Write-Host "=== [4/9] locate VS install + import vcvars64 into `$env: (defect H) ==="
        $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = $null
        if (Test-Path $vswhere) {
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath 2>$null | Select-Object -First 1
        }
        # vswhere returned EMPTY on this image before VS existed; keep an explicit
        # fallback to the path choco installs into so activation cannot silently
        # no-op and leave the GNU `link` in charge.
        if ([string]::IsNullOrWhiteSpace($vsPath)) {
          $vsPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
        }
        Write-Host "VS install path: $vsPath"
        $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
        if (-not (Test-Path $vcvars)) {
          throw "vcvars64.bat not found at $vcvars -- the C++ workload did not install"
        }
        # NOT Enter-VsDevShell: that loads a module whose session state breaks the
        # env.xml restore UPLOAD_ARTIFACTS performs (defect H). Running vcvars in a
        # child cmd and copying its environment back gives the same INCLUDE / LIB /
        # PATH with zero PowerShell session state.
        $vcOut = & cmd.exe /c "call `"$vcvars`" >NUL 2>&1 && set"
        Assert-Ok "vcvars64.bat"
        $vcCount = 0
        foreach ($line in $vcOut) {
          if ($line -match '^([^=]+)=(.*)$') {
            Set-Item -Path "Env:\$($matches[1])" -Value $matches[2]
            $vcCount++
          }
        }
        Write-Host "vcvars imported $vcCount environment variables"
        if (-not $env:INCLUDE -or -not $env:LIB) {
          throw "vcvars import produced no INCLUDE/LIB -- MSVC env is not active"
        }

        Write-Host "=== [5/9] node $env:NODE_VERSION + zig $env:ZIG_VERSION (pinned) ==="
        Invoke-WebRequest -Uri "https://nodejs.org/dist/v$($env:NODE_VERSION)/node-v$($env:NODE_VERSION)-win-x64.zip" -OutFile "C:\node.zip"
        Expand-Archive "C:\node.zip" -DestinationPath "C:\node-tmp" -Force
        Move-Item "C:\node-tmp\node-v$($env:NODE_VERSION)-win-x64" "C:\node" -Force
        Invoke-WebRequest -Uri "https://ziglang.org/download/$($env:ZIG_VERSION)/zig-windows-x86_64-$($env:ZIG_VERSION).zip" -OutFile "C:\zig.zip"
        Expand-Archive "C:\zig.zip" -DestinationPath "C:\zig-tmp" -Force
        Move-Item "C:\zig-tmp\zig-windows-x86_64-$($env:ZIG_VERSION)" "C:\zig" -Force

        Write-Host "=== [6/9] fresh rustup into C:\cargo / C:\rustup (defect C) ==="
        Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile "C:\rustup-init.exe"
        # Start-Process, NOT direct invocation: rustup-init returns non-zero via
        # the direct path because of an MSVC warning.
        $p = Start-Process -FilePath "C:\rustup-init.exe" `
          -ArgumentList "-y","--default-toolchain","stable","--profile","minimal","--no-modify-path" `
          -Wait -NoNewWindow -PassThru
        Write-Host "rustup exit: $($p.ExitCode)"
        if ($p.ExitCode -ne 0) { exit $p.ExitCode }

        Set-BuildPath
        Write-Host "=== toolchain AFTER cleanup (must be C:\cargo\bin, NOT chocolatey) ==="
        Get-Command rustc,cargo,rustup,node,npm,zig -ErrorAction SilentlyContinue |
          Select-Object Name,Source | Format-Table -AutoSize | Out-String | Write-Host
        Write-Host "=== resolved linker (must be the MSVC link.exe, NOT msys64) ==="
        Get-Command link.exe,cl.exe -ErrorAction SilentlyContinue |
          Select-Object Name,Source | Format-Table -AutoSize | Out-String | Write-Host
        $linkSrc = (Get-Command link.exe -ErrorAction SilentlyContinue).Source
        if ($linkSrc -like "*msys64*" -or $linkSrc -like "*Git*") {
          throw "GNU link shadowing MSVC link.exe: $linkSrc"
        }

        rustup component add rustfmt clippy
        Assert-Ok "rustup component add"
        rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
        Assert-Ok "rustup target add"
        rustc --version; cargo --version; cargo clippy --version; cargo fmt --version
        node --version; npm --version; zig version

        Write-Host "=== [7/9] Rust gates (fmt + clippy + workspace tests) ==="
        cargo fmt --all --check
        Assert-Ok "cargo fmt --all --check"
        cargo clippy --workspace --all-targets -- -D warnings
        Assert-Ok "cargo clippy --workspace --all-targets -- -D warnings"
        # Default set only -- the #[ignore] cases need the operator's live
        # ~43 GB archive DB or a real OS keyring. Never pass --ignored here.
        # Unchanged, identical to the local command: defect F5 (J) is fixed in
        # src-tauri/build.rs, not by narrowing the gate.
        cargo test --workspace
        Assert-Ok "cargo test --workspace"

        Write-Host "=== [8/9] frontend gates + build + sidecar staging ==="
        npm --prefix frontend ci
        Assert-Ok "npm ci"

        # Frontend gate parity with linux.yml `make lint` / `test:unit` and with
        # .github/workflows/ci.yml. Bare npm, not make: GNU make is not
        # guaranteed on this image (ci.yml drops to bare npm here too).
        # Every one gets its own Assert-Ok -- defect F: a non-zero native exit
        # does NOT stop a one-block PowerShell script, so an unasserted gate is
        # a gate that cannot fail.
        npm --prefix frontend run format:check
        Assert-Ok "npm run format:check"
        npm --prefix frontend run lint
        Assert-Ok "npm run lint"
        npm --prefix frontend run typecheck
        Assert-Ok "npm run typecheck"
        # Single-dictionary gate. Runs from the repo root; the script resolves
        # frontend/src itself via path.join, so it is separator-agnostic.
        node scripts/check-i18n.mjs
        Assert-Ok "node scripts/check-i18n.mjs"
        # Vitest, headless. NOT piped and NOT redirected: cargo/npm stderr under
        # a Stop preference becomes a terminating NativeCommandError (defect
        # class behind the `2>&1` ban). Let it stream straight to CloudWatch.
        npm --prefix frontend run test:unit
        Assert-Ok "npm run test:unit"

        # Tauri's beforeBuildCommand runs `npm run build` with cwd=frontend, so
        # frontend/dist must be producible; build it up front to fail fast.
        npm --prefix frontend run build
        Assert-Ok "npm run build"

        cargo install tauri-cli --version "^2" --locked
        Assert-Ok "cargo install tauri-cli"
        cargo install cargo-zigbuild --locked
        Assert-Ok "cargo install cargo-zigbuild"

        # askpass: native Windows binary. externalBin resolves
        # `agentlens-askpass` to `agentlens-askpass-<triple>.exe`, and the
        # bundler strips the triple back off on install.
        cargo build -p agentlens-askpass --release
        Assert-Ok "cargo build -p agentlens-askpass"
        $stage = "target\dist\binaries"
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        Copy-Item "target\release\agentlens-askpass.exe" `
          "$stage\agentlens-askpass-x86_64-pc-windows-msvc.exe" -Force

        # collectors: LINUX musl binaries, cross-compiled with zig because
        # Windows has no musl cc. Declared as `resources`, so the names are
        # copied verbatim -- no triple suffix.
        cargo zigbuild -p agentlens-collector --target x86_64-unknown-linux-musl --release
        Assert-Ok "cargo zigbuild x86_64-unknown-linux-musl"
        cargo zigbuild -p agentlens-collector --target aarch64-unknown-linux-musl --release
        Assert-Ok "cargo zigbuild aarch64-unknown-linux-musl"
        Copy-Item "target\x86_64-unknown-linux-musl\release\agentlens-collector" `
          "$stage\agentlens-collector-x86_64-unknown-linux-musl" -Force
        Copy-Item "target\aarch64-unknown-linux-musl\release\agentlens-collector" `
          "$stage\agentlens-collector-aarch64-unknown-linux-musl" -Force

        # collectors.sha256 lists the INSTALLED names (no triple suffix) so the
        # operator can `sha256sum -c` inside the install dir.
        Push-Location $stage
        Get-ChildItem "agentlens-collector-*" | ForEach-Object {
          $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
          "$h  $($_.Name)"
        } | Set-Content -Encoding ascii "collectors.sha256"
        Get-Content "collectors.sha256" | Write-Host
        Pop-Location

        Write-Host "=== [9/9] NSIS installer ==="
        # Must run from the REPO ROOT -- from frontend/ Tauri panics
        # "Couldn't recognize the current folder as a Tauri project".
        # The bundle overlay is committed and owned elsewhere: do not edit it.
        cargo tauri build --bundles nsis --config src-tauri/tauri.bundle.windows.json
        Assert-Ok "cargo tauri build --bundles nsis"

        Write-Host "=== NSIS output ==="
        Get-ChildItem "target\release\bundle\nsis" -ErrorAction SilentlyContinue |
          Format-List Name,Length | Out-String | Write-Host
        $nsis = Get-ChildItem "target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue
        if (-not $nsis) { throw "NSIS installer not produced under target\release\bundle\nsis" }

        New-Item -ItemType Directory -Force -Path "artifacts\dist" | Out-Null
        Copy-Item $nsis.FullName "artifacts\dist\" -Force
        Copy-Item "$stage\collectors.sha256" "artifacts\dist\" -Force

        # sha256sums.txt covers the installer itself, matching what `make dist`
        # emits on Linux so the release page has one uniform verification story.
        Push-Location "artifacts\dist"
        Get-ChildItem "*.exe" | ForEach-Object {
          $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
          "$h  $($_.Name)"
        } | Set-Content -Encoding ascii "sha256sums.txt"
        Get-Content "sha256sums.txt" | Write-Host
        Pop-Location

        Get-ChildItem "artifacts\dist" | Format-List Name,Length | Out-String | Write-Host
        Write-Host "Windows gate complete."
        } finally {
          $ErrorActionPreference = "Continue"
          Write-Host "reset ErrorActionPreference (defect H)"
        }

artifacts:
  # base-directory is the OUTPUT dir, not the repo root -- see defect (I).
  files:
    - "**/*"
  name: agentlens-windows
  base-directory: artifacts/dist
