version: 0.2

# ===========================================================================
# AgentLens — macOS gate + .app/.dmg bundle (CodeBuild MAC_ARM, fleet-backed)
# ---------------------------------------------------------------------------
# Project     : agentlens-macos
# Image       : aws/codebuild/macos-arm-base:15
# Env type    : MAC_ARM  (macOS on CodeBuild is FLEET-ONLY — there is no
#               on-demand macOS compute)
# Compute     : BUILD_GENERAL1_LARGE  (fixed by the MAC_ARM fleet type)
# Fleet       : reuse an EXISTING fleet — workkit-macos-fleet or
#               test-mac-us-west-2 in us-west-2, test-mac-us-east-2 in
#               us-east-2. Do NOT create a new fleet.
# Source      : S3 zip (this repo has NO git remote yet — see .aws/README.md)
# Timeout     : >= 120 minutes
#
# !!! SERIALIZE !!!  Both reusable MAC_ARM fleets have baseCapacity = 1, so
#     exactly ONE macOS build can run at a time across the whole account. If a
#     sibling project (workkit-macos) is building, this one queues behind it.
#     Do not launch parallel macOS builds and then read the queue delay as a
#     hang. Check `aws codebuild list-builds-for-project` before starting.
#
# ---------------------------------------------------------------------------
# >>> OWNERSHIP: src-tauri/tauri.bundle.macos.json DOES NOT EXIST YET. <<<
#     The macOS platform worker (AW4) owns creating it. This buildspec already
#     references it, so AW4's job is to ADD THAT ONE CONFIG FILE and iterate on
#     the build — not to invent a buildspec from scratch.
#
#     It must mirror src-tauri/tauri.bundle.windows.json, because macOS has the
#     same constraint Windows does: the two collectors are LINUX musl binaries
#     and must NOT go through `externalBin` (Tauri would demand a
#     host-triple-suffixed copy per platform and resolve the wrong file). They
#     belong in `resources`, copied verbatim into the .app bundle. Only the
#     natively-built askpass is an externalBin. Expected shape:
#
#       {
#         "$schema": "https://schema.tauri.app/config/2",
#         "bundle": {
#           "externalBin": ["../target/dist/binaries/agentlens-askpass"],
#           "resources": {
#             "../target/dist/binaries/agentlens-collector-x86_64-unknown-linux-musl": "",
#             "../target/dist/binaries/agentlens-collector-aarch64-unknown-linux-musl": "",
#             "../target/dist/binaries/collectors.sha256": ""
#           }
#         }
#       }
#
#     Step [7/8] below fails FAST with that message if the file is absent, so
#     the first red build tells AW4 exactly what to add instead of dying deep
#     inside the bundler with ResourcePathNotFound.
#
# ---------------------------------------------------------------------------
# TARGET ARCHITECTURE DECISION: aarch64-apple-darwin ONLY (not universal).
#   The host is Apple Silicon, so aarch64 is the free, native build. We
#   deliberately do NOT build `universal-apple-darwin` because:
#     1. The fleet is baseCapacity 1 and every macOS build is serialized
#        account-wide — a universal build roughly doubles the Rust compile and
#        therefore doubles the time everyone else waits.
#     2. The sidecars shipped inside the bundle are Linux musl binaries
#        regardless of host arch, so nothing about the product couples to a fat
#        binary.
#     3. Intel Mac support is not a stated requirement for a new app.
#   TO FLIP LATER (AW4's call, two-line change): add
#     `rustup target add x86_64-apple-darwin`
#   to step [3/8] and change the `--target` in step [8/8] to
#   `universal-apple-darwin`.
#
# CONTAINS NO ACCOUNT-SPECIFIC DATA (no account IDs, bucket names, role ARNs).
#
# ---------------------------------------------------------------------------
# GOTCHAS ENCODED HERE
#   - brew-installed node is NOT on PATH by default; export the keg bin dir.
#   - macOS has no musl cc, so the Linux collector sidecars are cross-compiled
#     with `cargo-zigbuild` (zig ships a musl sysroot for every target). Same
#     reasoning as .aws/buildspec/windows.yml — read its SIDECAR STAGING note.
#   - `cargo tauri build` MUST run from the repo root; from frontend/ it panics
#     "Couldn't recognize the current folder as a Tauri project".
#   - Bundles are UNSIGNED. Fine for internal verification. Notarised
#     distribution would need an Apple Developer cert in Secrets Manager plus
#     codesign/notarytool steps — explicitly out of scope for the proving ground.
#   - Plain `cargo test --workspace` skips the 18 `#[ignore]` cases (they need
#     the operator's live ~43 GB archive DB or a real OS keyring). NEVER pass
#     --ignored / --include-ignored in a CI gate.
#   - E2E (Playwright / wdio + tauri-driver) is out of scope: deferred to the
#     E2E worker (AW5). The frontend gates run here are all headless.
#
# SCOPE NOTE — FRONTEND GATE PARITY (revised; see .aws/README.md "parity")
#   Like windows.yml, this file now DOES run the same frontend gates as
#   linux.yml and .github/workflows/ci.yml: format:check, lint, typecheck,
#   check-i18n.mjs, test:unit and `npm run build`. Skipping them "because Linux
#   owns the platform-neutral gates" made the buildspec a STRICT SUBSET of the
#   workflow it is supposed to be the proven source for, and a workflow step no
#   buildspec ever ran is an unproven step.
#
#   Still deliberately NOT here, each for a stated reason (NOT silent omission):
#     - oxfmt (part of `make fmt-check`): platform-neutral YAML/JSON/Markdown
#       bytes; a second opinion adds no signal. Linux-only in ci.yml too.
#     - `make coverage-gate`: one coverage number per commit, else Codecov
#       double-counts. Linux-only in ci.yml too.
#     - `make dist` / `make dist-all`: Linux packaging; this platform ships .dmg.
#     - the ts-rs bindings drift gate: the S3 source zip carries no `.git/`, so
#       `git status --porcelain -- frontend/src/generated/` cannot detect drift
#       here, and the export half costs a feature-flagged rebuild of
#       agentlens-tauri on a capacity-1 serialized fleet. Linux proves the
#       export; ci.yml under actions/checkout is where the drift half is real.
#   `npm run build` runs regardless because Tauri's beforeBuildCommand needs
#   frontend/dist.
# ===========================================================================

env:
  variables:
    CARGO_TERM_COLOR: "always"
    RUST_BACKTRACE: "1"
    ZIG_VERSION: "0.14.0"
    MACOS_TARGET: "aarch64-apple-darwin"
    MACOS_BUNDLE_CONFIG: "src-tauri/tauri.bundle.macos.json"
    # MEASURED, NOT COSMETIC. tauri-bundler 2.9.4
    # (src/bundle/macos/dmg/mod.rs:174) only passes `--skip-jenkins` to
    # bundle_dmg.sh when the env var CI is EXACTLY the string "true". Without it
    # the script runs `/usr/bin/osascript` to prettify the Finder window, which
    # has no GUI session on a CodeBuild fleet host and exits 64 with
    # "Failed running AppleScript" — after the .app is already built, so the
    # failure looks like a bundler bug rather than a headless-environment one.
    # CodeBuild does NOT set CI itself (it only sets CODEBUILD_*), so we do.
    CI: "true"

phases:
  install:
    commands:
      - echo "=== [1/8] host facts ==="
      - sw_vers && uname -m
      # rusqlite's `bundled` feature COMPILES sqlite3.c, so a working C
      # toolchain is a hard prerequisite. Probe it here, where the message is
      # unambiguous, instead of 20 minutes later inside a cc-rs build script.
      - xcode-select -p && cc --version
      # Colon-space inside an unquoted YAML sequence item silently turns the item
      # into a MAP, and CodeBuild then dies at DOWNLOAD_SOURCE before any gate
      # runs. Hence the outer single quotes — do not "simplify" them away.
      - 'echo "=== [2/8] brew: node 22 + zig (musl cross compiler for sidecars) ==="'
      # zig from brew rather than a pinned tarball: brew is the only sane
      # package path on the macOS image, and ZIG_VERSION above documents the
      # version this buildspec was designed against for the other platforms.
      - brew install node@22 zig
      # brew kegs are NOT on PATH by default — this is the classic macOS
      # CodeBuild trap ("node: command not found" right after a successful brew).
      - export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
      - node --version && npm --version && zig version
      - echo "=== [3/8] rust stable + musl targets ==="
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup component add rustfmt clippy
      - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - rustc --version && cargo --version && cargo clippy --version && cargo fmt --version
      - echo "=== [4/8] tauri-cli v2 + cargo-zigbuild ==="
      - cargo install tauri-cli --version "^2" --locked
      - cargo install cargo-zigbuild --locked
      - cargo tauri --version

  pre_build:
    commands:
      - export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/node@22/bin:$PATH"
      - echo "=== [5/8] frontend deps ==="
      - npm --prefix frontend ci
      - make dist-version

  build:
    commands:
      - export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/node@22/bin:$PATH"
      - echo "=== [6/8] Rust gates (fmt + clippy + workspace tests) ==="
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      # Default set only — see the IGNORED-TESTS note in the header.
      - cargo test --workspace
      # Frontend gate parity with linux.yml `make lint` / `test:unit` and with
      # .github/workflows/ci.yml. Bare npm rather than `make lint`, exactly as
      # ci.yml does on non-Linux: `make lint` would drag in oxfmt, which checks
      # platform-neutral bytes that Linux is already authoritative for.
      - 'echo "=== [7/8] frontend gates + build + sidecar staging ==="'
      - npm --prefix frontend run format:check
      - npm --prefix frontend run lint
      - npm --prefix frontend run typecheck
      # Single-dictionary gate; run from the repo root, the script resolves
      # frontend/src itself.
      - node scripts/check-i18n.mjs
      # Vitest, headless. Each of these is its own buildspec list item, so
      # CodeBuild checks the exit code of every one -- no Assert-Ok equivalent
      # needed on a POSIX host.
      - npm --prefix frontend run test:unit
      - npm --prefix frontend run build
      # Fail FAST and actionably if AW4 has not added the bundle overlay yet.
      - |
        if [ ! -f "$MACOS_BUNDLE_CONFIG" ]; then
          echo "缺少 $MACOS_BUNDLE_CONFIG —— 该文件由 macOS 平台负责人（AW4）创建。"
          echo "请参照本 buildspec 头部注释里的 externalBin / resources 结构新增它："
          echo "  externalBin: ../target/dist/binaries/agentlens-askpass"
          echo "  resources  : 两个 agentlens-collector-*-unknown-linux-musl + collectors.sha256"
          exit 1
        fi
      # askpass: native aarch64 binary. externalBin resolves `agentlens-askpass`
      # to `agentlens-askpass-<triple>`; the bundler strips the triple on install.
      - cargo build -p agentlens-askpass --release --target "$MACOS_TARGET"
      - mkdir -p target/dist/binaries
      - cp "target/$MACOS_TARGET/release/agentlens-askpass" "target/dist/binaries/agentlens-askpass-$MACOS_TARGET"
      # collectors: LINUX musl binaries, cross-compiled with zig because macOS
      # has no musl cc. Declared as `resources`, so names are copied verbatim.
      - cargo zigbuild -p agentlens-collector --target x86_64-unknown-linux-musl --release
      - cargo zigbuild -p agentlens-collector --target aarch64-unknown-linux-musl --release
      - cp target/x86_64-unknown-linux-musl/release/agentlens-collector target/dist/binaries/agentlens-collector-x86_64-unknown-linux-musl
      - cp target/aarch64-unknown-linux-musl/release/agentlens-collector target/dist/binaries/agentlens-collector-aarch64-unknown-linux-musl
      # collectors.sha256 lists the INSTALLED names so the operator can verify
      # the sidecars in place with `shasum -a 256 -c`.
      - cd target/dist/binaries && shasum -a 256 agentlens-collector-* > collectors.sha256 && cat collectors.sha256 && cd -
      - chmod 0755 target/dist/binaries/*
      - echo "=== [8/8] macOS bundle (.app + .dmg, unsigned, $MACOS_TARGET) ==="
      # Must run from the REPO ROOT (see header gotchas).
      - cargo tauri build --bundles app,dmg --target "$MACOS_TARGET" --config "$MACOS_BUNDLE_CONFIG"

  post_build:
    commands:
      - echo "=== bundle output (full tree — proves the sidecars landed) ==="
      # `ls -R` of the whole bundle dir is the only way to verify from the log
      # that askpass and BOTH collectors are really inside the .app, since the
      # .dmg cannot be mounted anywhere but macOS.
      - ls -R "target/$MACOS_TARGET/release/bundle/"
      - mkdir -p artifacts/dist
      # No `|| true` anywhere below: a missing .dmg must turn the build RED.
      # `cp ... || true` is exactly how a bundler failure gets laundered into a
      # green build with an empty artifact zip.
      - cp "target/$MACOS_TARGET"/release/bundle/dmg/*.dmg artifacts/dist/
      - cp target/dist/binaries/collectors.sha256 artifacts/dist/
      - cd artifacts/dist && shasum -a 256 *.dmg > dmg.sha256 && cat dmg.sha256 && cd -
      - ls -l artifacts/dist/
      - test -n "$(ls artifacts/dist/*.dmg 2>/dev/null)"
      - echo "macOS gate complete (unsigned bundle)."

artifacts:
  files:
    - artifacts/dist/*
  name: agentlens-macos
  base-directory: .
