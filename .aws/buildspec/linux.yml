version: 0.2

# ===========================================================================
# AgentLens — Linux full gate (CodeBuild LINUX_CONTAINER)
# ---------------------------------------------------------------------------
# Project     : agentlens-linux
# Image       : aws/codebuild/standard:7.0  (Ubuntu 22.04 "jammy")
# Compute     : BUILD_GENERAL1_2XLARGE  (Rust + Tauri compile is CPU-bound)
# Source      : S3 zip (this repo has NO git remote yet — see .aws/README.md)
# Timeout     : >= 90 minutes
#
# WHY THIS FILE EXISTS
#   CodeBuild is the PROVING GROUND, not an alternative to GitHub Actions. The
#   GitHub workflow is written LATER by mechanically translating the steps that
#   already went green here. So every step below is deliberately a plain shell
#   invocation of a Makefile / npm / cargo target that also exists locally —
#   `run: make lint` in a workflow is then a 1:1 copy of the line here. Do NOT
#   inline CodeBuild-only logic into a gate; put it in the Makefile instead.
#
# CONTAINS NO ACCOUNT-SPECIFIC DATA (no account IDs, bucket names, role ARNs).
# Those live in the Makefile `aws-*` targets and the `create-project` CLI call.
#
# ---------------------------------------------------------------------------
# MEASURED GOTCHAS ENCODED HERE (do not rediscover)
#
# 1. STALE CARGO REGISTRY — standard:7.0 ships a cargo config/registry cache
#    that conflicts with a fresh rustup install. Evict it before installing
#    (same as codegraph-rust/.aws/buildspec/linux.yml).
#
# 2. PREINSTALLED RUST LAGS — the image's toolchain trails what the workspace
#    needs. Install a FRESH rustup stable and prepend $HOME/.cargo/bin.
#    Workspace MSRV is 1.82 (root Cargo.toml `rust-version`); stable is fine.
#
# 3. TAURI 2 LINUX SYSTEM DEPS — the local (Arch) machine hit these failures
#    (.omo/notepads/.../learnings.md):
#      - "Can't detect any appindicator library"  -> libayatana-appindicator3-dev
#        (required because src-tauri enables the tauri `tray-icon` feature)
#      - webkit2gtk 2.52.5 runtime deps           -> libwebkit2gtk-4.1-dev
#    Translated to Debian/Ubuntu 22.04 names below. libwebkit2gtk-4.1-dev pulls
#    libsoup-3.0 + libjavascriptcoregtk-4.1, but we name them EXPLICITLY so a
#    future base-image change cannot silently drop them.
#
# 4. musl COLLECTORS — `rusqlite` uses the `bundled` feature, which COMPILES
#    sqlite3.c, so each musl target needs a musl-ABI C compiler:
#      - x86_64: `musl-gcc`, from the Debian package `musl-tools`.
#      - aarch64: needs a musl-ABI aarch64 cc. `aarch64-linux-gnu-gcc` is the
#        WRONG ABI (glibc) and will not work. The Makefile prefers
#        `aarch64-linux-musl-gcc`, else auto-generates a `zig cc -target
#        aarch64-linux-musl` wrapper. We install ZIG here so the Makefile takes
#        the zig path. The Makefile's wrapper already strips the `--target=`
#        argument cc-rs injects (zig only accepts 3-part targets) and sets
#        `-C link-self-contained=no` (otherwise `ld.lld: duplicate symbol:
#        _start`). Nothing to re-derive — just make `zig` resolvable on PATH.
#
# 5. NODE VERSION — the frontend is on Vite 8 / Vitest 4 / TypeScript 6, which
#    require Node >= 20.19. `runtime-versions: nodejs` on standard:7.0 tops out
#    below what we want to rely on, so we install a PINNED Node from the
#    official tarball. Pinned, not `latest`, so a rerun is reproducible.
#
# 6. `cargo tauri build` MUST RUN FROM THE REPO ROOT — from `frontend/` it
#    panics "Couldn't recognize the current folder as a Tauri project". All
#    Makefile dist targets already run from the root; do not `cd` before them.
#
# 7. IGNORED TESTS MUST NOT RUN — 18 of 181 Rust tests are `#[ignore]` because
#    they need the operator's live ~43 GB archive DB or a real OS keyring/GUI.
#    Plain `cargo test --workspace` skips them, which is exactly what we want.
#    NEVER add `--ignored` / `--include-ignored` to a CI gate.
#
# 8. E2E — TIER 1 IS NOW GATED HERE, TIER 2 IS NOT.
#    `test:e2e` (Playwright, 56 specs, real Chromium against `vite dev` with the
#    IPC layer mocked) runs as gate [5/7]. Playwright needs a browser plus the
#    shared libs Chromium links, so `playwright install --with-deps chromium`
#    runs in pre_build — `standard:7.0` has neither. It is headless, so no X
#    server is involved: Chromium runs with its own headless compositor.
#    `test:e2e:real` (wdio + tauri-driver + WebKitWebDriver, 8 specs) is still
#    NOT here. It needs the real Tauri WebView, a debug `agentlens-tauri`
#    binary, an X display and a populated archive DB. Its precise blocker on
#    CodeBuild is measured in `.aws/buildspec/linux-e2e-real-probe.yml`, which
#    exists exactly so that "we never tried" is not the answer. Do NOT wire that
#    tier in here until the probe goes green — a gate nobody has seen pass is
#    worse than an honest omission.
#    `ci.yml` runs NEITHER tier, so gating Playwright here makes the buildspec a
#    strict SUPERSET of the workflow, which is the direction the parity contract
#    in .aws/README.md wants.
#
# 9. EVERY `echo` BANNER IS YAML-SINGLE-QUOTED — NOT COSMETIC. A buildspec
#    command written as a bare (plain) YAML scalar is silently mis-parsed by
#    three separate characters, and CodeBuild rejects or mangles it in
#    DOWNLOAD_SOURCE, before a single gate runs:
#      - `: ` (colon + space) turns the item into a MAP. Measured:
#        `- echo "=== apt: build ... ==="` -> "Expected Commands[0] to be of
#        string type: found subkeys instead at line 95".
#      - ` #` starts a YAML comment, so `(18 #[ignore] stay skipped)` truncates
#        the item mid-string and leaves an unbalanced shell quote.
#      - a backtick is fine to YAML but the surviving double-quoted shell string
#        COMMAND-SUBSTITUTES it, so `` `cargo tauri build` `` would really run a
#        build inside an echo.
#    Single quotes make all three inert (no banner contains a `'`). Validate
#    locally before every upload — it costs a second and saves a 20-minute
#    round trip:
#      python3 -c 'import yaml,sys; d=yaml.safe_load(open(".aws/buildspec/linux.yml")); \
#        [sys.exit(f"not a string: {p}[{i}] {c!r}") for p,b in d["phases"].items() \
#         for i,c in enumerate(b["commands"]) if not isinstance(c,str)]'
# ===========================================================================

env:
  variables:
    CARGO_TERM_COLOR: "always"
    RUST_BACKTRACE: "1"
    # Pinned Node (frontend needs >= 20.19 for Vite 8 / Vitest 4 / TS 6).
    NODE_VERSION: "22.14.0"
    # Pinned zig — used ONLY as the aarch64-musl C cross compiler for the
    # collector (see gotcha 4). The Makefile auto-detects it on PATH.
    ZIG_VERSION: "0.14.0"
    # Pinned oxfmt — `make fmt-check` runs it over YAML/JSON/Markdown. Must match
    # the version the committed formatting was produced with, else a newer
    # formatter reformats bytes we committed and the gate goes red for nothing.
    OXFMT_VERSION: "0.59.0"
    # Fail `make dist-all` loudly rather than shipping a single-arch bundle.
    DIST_REQUIRE_AARCH64: "1"

phases:
  install:
    commands:
      - 'echo "=== apt: build toolchain + Tauri 2 GTK/WebKit stack + musl ==="'
      - apt-get update
      # build-essential/pkg-config/libssl-dev : baseline Rust native builds
      # libwebkit2gtk-4.1-dev + libsoup-3.0-dev + libjavascriptcoregtk-4.1-dev
      #                                         : Tauri 2 webview (gotcha 3)
      # libgtk-3-dev / librsvg2-dev / patchelf  : Tauri bundler
      # libayatana-appindicator3-dev            : tray-icon feature (gotcha 3)
      # musl-tools                              : provides musl-gcc (gotcha 4)
      # xz-utils / unzip / curl / file          : tarball + bundler helpers
      - >-
        apt-get install -y --no-install-recommends
        build-essential pkg-config libssl-dev
        libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
        libgtk-3-dev librsvg2-dev patchelf
        libayatana-appindicator3-dev
        musl-tools
        curl file unzip xz-utils
      - 'echo "=== node (pinned $NODE_VERSION; image runtime is too old for Vite 8) ==="'
      - curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
      - mkdir -p /usr/local/node && tar -xJf /tmp/node.tar.xz -C /usr/local/node --strip-components=1
      - export PATH="/usr/local/node/bin:$PATH"
      - node --version && npm --version
      - 'echo "=== zig (pinned $ZIG_VERSION; aarch64-musl C cross compiler) ==="'
      - curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
      - mkdir -p /usr/local/zig && tar -xJf /tmp/zig.tar.xz -C /usr/local/zig --strip-components=1
      - ln -sf /usr/local/zig/zig /usr/local/bin/zig
      - zig version
      - 'echo "=== rust: evict stale registry, then fresh stable (gotchas 1+2) ==="'
      - rm -rf $HOME/.cargo/registry $HOME/.cargo/config.toml
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup component add rustfmt clippy llvm-tools-preview
      - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - rustc --version && cargo --version && cargo clippy --version && cargo fmt --version
      - 'echo "=== cargo-llvm-cov (prebuilt; cargo install would add minutes) ==="'
      - curl --proto '=https' --tlsv1.2 -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C "$HOME/.cargo/bin"
      - cargo llvm-cov --version
      - 'echo "=== tauri-cli v2 (Makefile dist targets call cargo tauri build) ==="'
      - cargo install tauri-cli --version "^2" --locked
      - cargo tauri --version
      - 'echo "=== oxfmt $OXFMT_VERSION (make fmt-check checks YAML/JSON/Markdown with it) ==="'
      # PINNED, and a HARD install: `make fmt-check` silently *skips* oxfmt when the
      # binary is absent (it only prints a hint), so a soft `|| true` here would
      # quietly downgrade the format gate to "Rust only". Pin the exact version the
      # committed formatting was produced with — `oxfmt@latest` drifts (0.61 vs the
      # 0.59 used locally) and a newer formatter can legitimately reformat bytes we
      # committed, turning a version bump into a phantom red.
      - npm install -g "oxfmt@${OXFMT_VERSION}"
      - command -v oxfmt && oxfmt --version

  pre_build:
    commands:
      - export PATH="$HOME/.cargo/bin:/usr/local/node/bin:$PATH"
      - 'echo "=== frontend deps (npm ci — lockfile is authoritative) ==="'
      # The ts-rs bindings gate shells out to `npx prettier` and `npx tsc`
      # inside frontend/, so node_modules must exist BEFORE the Rust gates.
      - npm --prefix frontend ci
      - 'echo "=== playwright chromium + its shared libs (gate 5 needs a browser) ==="'
      # `--with-deps` is the load-bearing half: standard:7.0 lacks libnss3,
      # libasound2, libatk-bridge2.0 and friends, and Chromium then dies with a
      # bare "error while loading shared libraries" that reads like a Playwright
      # bug. Must come AFTER `npm ci` (playwright is a devDependency) and it
      # apt-installs, so it must run as root — which CodeBuild is.
      - (cd frontend && npx playwright install --with-deps chromium)
      - (cd frontend && npx playwright --version)
      - 'echo "=== workspace version self-check (single source of truth) ==="'
      - make dist-version

  build:
    commands:
      - export PATH="$HOME/.cargo/bin:/usr/local/node/bin:$PATH"
      # ---- Gate 1: Rust format + clippy + frontend lint/typecheck + i18n ----
      # `make lint` = fmt-check (rustfmt + oxfmt) -> clippy -D warnings ->
      #               frontend format:check / lint / typecheck ->
      #               node scripts/check-i18n.mjs
      # One target so the future GitHub workflow is literally `run: make lint`.
      - 'echo "=== [1/7] make lint ==="'
      - make lint
      # ---- Gate 2: Rust tests (default set only; see gotcha 7) --------------
      - 'echo "=== [2/7] cargo test --workspace (18 #[ignore] stay skipped) ==="'
      - cargo test --workspace
      # ---- Gate 3: frontend unit tests (Vitest, headless) ------------------
      - 'echo "=== [3/7] frontend unit tests ==="'
      - npm --prefix frontend run test:unit
      # ---- Gate 4: ts-rs bindings zero-drift ------------------------------
      # The test wipes frontend/src/generated/, re-exports every DTO, writes
      # index.ts, then runs the repo-pinned prettier + `tsc --noEmit`. If the
      # committed bindings differ from what Rust emits, the scoped git status
      # below is non-empty and we fail. Scoped on purpose: an unrelated dirty
      # file elsewhere must not turn this into a false red.
      - 'echo "=== [4/7] ts-rs bindings drift gate ==="'
      - cargo test -p agentlens-tauri --features ts-export bindings_export
      - |
        set -e
        git rev-parse --is-inside-work-tree >/dev/null
        drift="$(git status --porcelain -uall -- frontend/src/generated/)"
        if [ -n "$drift" ]; then
          echo "生成物漂移：frontend/src/generated/ 与 Rust DTO 不一致"
          echo "$drift"
          git --no-pager diff -- frontend/src/generated/
          exit 1
        fi
        echo "bindings 零漂移"
      # The `git status` above is REAL on CodeBuild as of the commit that added
      # this note: `make aws-source-upload` now ships `.git/` inside the S3 zip
      # and asserts `.git/HEAD` + `.git/index` + a non-empty `.git/objects/` are
      # present before it will upload. Before that, the zip excluded `.git/`, so
      # `git status` was structurally empty and this whole gate silently meant
      # only "the export did not crash" — it could not go red no matter how far
      # the committed bindings had drifted from the Rust DTOs. Proven red and
      # then green on us-east-2; see .omo/evidence/aws-use2-e2e-drift.md. If you
      # ever re-exclude `.git/`, you delete this gate without editing this file.
      # ---- Gate 5: Playwright component E2E (56 specs, mocked IPC) ----------
      # Real Chromium against `vite dev`; playwright.config.ts owns the
      # webServer lifecycle (`npm run dev` on the fixed port 1420 Tauri needs),
      # so nothing is backgrounded by hand here. `make test-e2e` is the same
      # target a developer runs, keeping the future workflow a 1:1 copy.
      - 'echo "=== [5/7] make test-e2e (Playwright, mocked IPC) ==="'
      - make test-e2e
      # ---- Gate 6: coverage (>= COVERAGE_MIN, default 75) ------------------
      # `make coverage-gate` runs cargo-llvm-cov once and reads LF/LH straight
      # out of lcov.info — the same bytes Codecov will consume, so the local
      # number and the dashboard number cannot drift apart.
      - 'echo "=== [6/7] make coverage-gate -> artifacts/coverage/lcov.info ==="'
      - make coverage-gate
      # ---- Gate 6: real packaging -----------------------------------------
      # `dist-all` == `dist` + a HARD requirement that the aarch64 collector
      # exists. We installed zig precisely so that requirement is satisfiable;
      # using the degrading `dist` here would let a silently single-arch bundle
      # be reported as green. Produces artifacts/dist/{*.deb, both musl
      # collectors, sha256sums.txt} and then re-verifies the manifest.
      - 'echo "=== [7/7] make dist-all + dist-verify ==="'
      - make dist-all

  post_build:
    commands:
      - 'echo "=== dist artifacts ==="'
      - ls -l artifacts/dist/ || true
      - cat artifacts/dist/sha256sums.txt || true
      - 'echo "=== deb contents (askpass + both collectors must be present) ==="'
      - dpkg --contents artifacts/dist/*.deb || true
      - 'echo "=== coverage ==="'
      - ls -l artifacts/coverage/ || true
      - head -1 artifacts/coverage/summary.txt || true
      - 'echo "Linux full gate complete."'

artifacts:
  # lcov.info is kept for the later Codecov upload; the dist files are the
  # release candidates. Paths are relative to the source root.
  files:
    - artifacts/dist/*
    - artifacts/coverage/lcov.info
  name: agentlens-linux
  base-directory: .
