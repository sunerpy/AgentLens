version: 0.2

# ===========================================================================
# AgentLens - Windows NSIS installer SMOKE (headless, CodeBuild WINDOWS)
# ---------------------------------------------------------------------------
# Project     : agentlens-windows  (run with --buildspec-override)
# Image       : aws/codebuild/windows-base:2022-1.0
# Env type    : WINDOWS_SERVER_2022_CONTAINER
#
# WHY THIS FILE EXISTS
#   `windows.yml` proves the installer can be BUILT. It never runs it. Until
#   this file, every claim about the shipped installer was "the bytes are in
#   the package" - the exe had been launched by nobody, on no machine.
#   This buildspec closes the cheapest and largest part of that gap: silent
#   install, installed-layout inspection, collector checksum re-verification,
#   silent uninstall. All of it headless, all of it inside the same container
#   image the installer was built in.
#
#   It deliberately DOES NOT REBUILD. It downloads the artifact zip a previous
#   `windows.yml` run already uploaded, so a smoke run costs minutes instead of
#   the ~40 that a full Windows build costs, and - more important - it exercises
#   *the exact bytes that would ship*, not a fresh rebuild that merely ought to
#   be identical.
#
# WHAT THIS CAN NEVER PROVE (structural, not a TODO)
#   A CodeBuild Windows container has no DWM, no explorer.exe and no interactive
#   desktop session. Therefore NOTHING here can speak to: how the window looks,
#   whether the undecorated frame renders, whether the title bar drags, whether
#   the three window buttons or double-click-maximize work, whether the taskbar
#   and Explorer show the new icon, or how SmartScreen behaves. Those need a
#   real desktop session (EC2 Windows with DWM) and are tracked separately.
#   Do not let a green run here be read as "the installer was QA'd".
#
# CONTAINS NO ACCOUNT-SPECIFIC DATA. The artifact location arrives through
# SMOKE_ARTIFACT_BUCKET / SMOKE_ARTIFACT_KEY, supplied per run via
# `--environment-variables-override`, so this file stays committable.
#
# ---------------------------------------------------------------------------
# INHERITS THE MEASURED CodeBuild-Windows DEFECT WORKAROUNDS FROM windows.yml
#   (A) one PowerShell process per list item   => ONE list item
#   (B) inter-phase env.xml restore throws     => ONE phase
#   (F) native non-zero exit does not fail     => Assert-Ok after every native call
#   (G) the body is read as ANSI, not UTF-8    => PURE ASCII, comments included.
#       A single em dash costs a 1-second failure with EMPTY output. Assert it:
#         python3 -c 'import yaml;s=yaml.safe_load(open(".aws/buildspec/windows-installer-smoke.yml"))["phases"]["build"]["commands"][0];assert all(ord(c)<128 for c in s)'
#   (H) $ErrorActionPreference leak hangs      => try/finally reset
#   (I) artifact base-directory is the OUTPUT dir, never the repo root
#   See .aws/buildspec/windows.yml for the measured evidence behind each.
#
# ---------------------------------------------------------------------------
# BUGS FIXED IN REVIEW OF THE FIRST DRAFT (all pre-run, none of them cosmetic)
#
# (S1) THE DRAFT COULD NOT PARSE. Body line 101 carried a U+2014 em dash inside
#      a double-quoted string ("SILENT INSTALL (/S) - first execution ever").
#      That is exactly defect (G): under Windows PowerShell 5.1 reading the
#      command as ANSI the string terminates early, the block fails to parse,
#      and the phase dies in ~1 s with NO output at all. Caught by the ASCII
#      assertion above before a single build was started.
#
# (S2) NO `artifacts:` SECTION. The `agentlens-windows` project declares
#      artifacts type S3 / packaging ZIP. A buildspec with no artifacts section
#      leaves CodeBuild with nothing to upload, so a run whose every gate passed
#      would still be reported FAILED at UPLOAD_ARTIFACTS. Fixed by writing a
#      real report into artifacts\smoke and declaring it below. The report is
#      created EARLY (before any gate) so a genuine gate failure is attributed
#      to BUILD and never masked by a second failure in UPLOAD_ARTIFACTS.
#
# (S3) NULL ENV VARS MADE THE ROOT LIST A TERMINATING BINDING ERROR.
#      The draft built @($env:LOCALAPPDATA, "C:\Program Files", ...) and fed it
#      to Join-Path and to `Get-ChildItem -Path`. If LOCALAPPDATA / APPDATA /
#      USERPROFILE is empty in the container the array carries an empty string,
#      and a parameter-binding validation failure is TERMINATING **regardless of
#      -ErrorAction SilentlyContinue** - the suppression the draft relied on
#      does not apply to binding. Fixed by Resolve-Dirs, which drops empty and
#      non-existent entries before any cmdlet sees them.
#
# (S4) `Get-ChildItem -Recurse` OVER ALL OF `C:\Program Files` to find one exe.
#      On this image that walks VS2019 BuildTools and the Windows Kits - tens of
#      thousands of files - to answer a question we can answer with four
#      Test-Path calls. Fixed: probe <root>\AgentLens\AgentLens.exe directly,
#      and only fall back to a bounded recursive search if all probes miss.
#
# (S5) `_?=<dir>` WAS PASSED AS ITS OWN ArgumentList ELEMENT. PowerShell 5.1
#      joins ArgumentList with single spaces and does NOT quote elements that
#      contain spaces. Any install dir with a space (every perMachine layout,
#      i.e. C:\Program Files\AgentLens) would reach NSIS as `_?=C:\Program` plus
#      a stray `Files\AgentLens`, the in-place switch would be ignored, and the
#      exit code we gate on would describe the %TEMP% self-copy instead of the
#      uninstall - a gate that cannot fail. Fixed: ONE pre-quoted argument
#      string, `/S "_?=<dir>"`, plus TrimEnd('\') because NSIS rejects a
#      trailing backslash in `_?=`.
#
# (S6) THE AWS CLI WAS ASSUMED PRESENT ON PATH. Unverified on this image. Fixed:
#      resolve `aws` through Get-Command, then the two known install dirs, then
#      fall back to Read-S3Object from the AWS PowerShell module, and only then
#      throw - with a message that names every path that was tried.
#
# (S7) `whoami` AND `Get-CimInstance Win32_OperatingSystem` AS DIAGNOSTICS.
#      whoami is a native exe and CIM needs the WMI service, which a Server Core
#      container is not obliged to run. Under `Stop` either could kill the run
#      BEFORE the first gate, for zero diagnostic value. Fixed: pure .NET
#      equivalents, and the optional CIM call wrapped in its own try/catch.
#
# (S8) TOP-LEVEL-ONLY GLOB FOR THE INSTALLER. `Get-ChildItem (Join-Path $pkg
#      "*-setup.exe")` is correct for today's flat artifact zip but silently
#      misses a nested layout, and would then report "no *-setup.exe inside the
#      artifact zip" - which reads as a packaging defect rather than as this
#      file's own layout assumption. Fixed: -Recurse, and the match count is
#      printed.
#
# (S9) COUNTING GATES BY GREP IS NOT PROVING THEM. CodeBuild echoes the
#      buildspec source into the log, so `grep -c 'gate ok:'` over windows.yml's
#      log returns 20 for 19 real gates: Assert-Ok's own Write-Host body is
#      echoed too. Fixed: each gate emits `SMOKE-GATE-OK <n>/<total>` with a
#      counter the script itself maintains, and the run ends by asserting the
#      counter reached the declared total. The count is now produced by the
#      program, not by a grep over text that also appears in the source.
#
# (S10) THE INSTALLED MAIN BINARY IS NOT NAMED AgentLens.exe. <-- MEASURED,
#      build 0e95cd18, and the one bug that could only be found by running.
#      `mainBinaryName` is unset in src-tauri/tauri.conf.json, so Tauri v2 keeps
#      the CARGO BIN NAME: the installed binary is `agentlens-tauri.exe`, even
#      though productName is AgentLens and the shortcut is AgentLens.lnk. Both
#      the draft and the first hardened revision hardcoded `AgentLens.exe`, so
#      the layout gate was a guaranteed FALSE RED, and its fallback then walked
#      all of C:\Program Files recursively for a file that cannot exist.
#      Cross-checked outside CodeBuild by LZMA-decoding the installer payload
#      (magic \xef\xbe\xad\xdeNullsoftInst, stream at magic+24, 5-byte props +
#      8x\xff, lzma.FORMAT_ALONE): the UTF-16 strings carry `\agentlens-tauri.exe`,
#      `\uninstall.exe` and `\AgentLens.lnk` together, which settles it.
#      => the directory is resolved from the registry InstallLocation first, and
#      the main binary is IDENTIFIED by its own version resource
#      (ProductName == AgentLens) rather than by a guessed file name.
#
# NEW COVERAGE THE DRAFT DID NOT HAVE
#   - agentlens-askpass is asserted present. It is an externalBin and part of
#     the shipped capability (the SSH_ASKPASS peer); its absence is the same
#     class of silent capability loss as a missing collector. Matched by
#     wildcard so the gate fires on ABSENCE, not on a suffix guess.
#   - the uninstall-entry COUNT is gated in both directions: it must rise after
#     install and return to the pre-install baseline after uninstall. That
#     asserts a delta, not a guessed registry shape.
#   - the installed AgentLens.exe is checked against src-tauri/icons/icon.ico
#     frame by frame. This is the STRONG form of the icon question: the
#     installer's own PE icon table is the NSIS stub's icon and produces a false
#     negative, but the installed app binary's RT_ICON payloads are the app's
#     real frames, stored verbatim, so a plain byte search settles it.
#     REPORTED, NOT GATED on this first run - see the note at the site.
# ===========================================================================

env:
  variables:
    # Both REQUIRED at run time; empty defaults exist only so the file is valid
    # standalone. The block below fails fast when either is still empty.
    SMOKE_ARTIFACT_BUCKET: ""
    SMOKE_ARTIFACT_KEY: ""

phases:
  # SINGLE PHASE - see defect (B). Do not split this.
  build:
    commands:
      - |
        $ErrorActionPreference = "Stop"
        # try/finally, NOT reindented on purpose: the finally clears the
        # $ErrorActionPreference leak that otherwise hangs UPLOAD_ARTIFACTS for
        # the full timeout (defect H), on the failure path as well as the
        # success path.
        try {
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        # ---- gate bookkeeping (defect S9) --------------------------------
        # The total is declared, the counter is maintained by this script, and
        # the two are compared at the end. Do not audit gates by grepping the
        # log: CodeBuild echoes this source text into it.
        $GATE_TOTAL = 10
        $script:GateN = 0
        function Gate-Ok([string]$what) {
          $script:GateN++
          Write-Host ("SMOKE-GATE-OK {0}/{1}: {2}" -f $script:GateN, $GATE_TOTAL, $what)
        }
        # ---- helper: make a non-zero native exit FAIL the build (defect F) --
        function Assert-Ok([string]$what) {
          if ($LASTEXITCODE -ne 0) {
            throw "GATE FAILED: $what exited with code $LASTEXITCODE"
          }
          Write-Host "native ok: $what"
        }
        # ---- helper: only real, non-empty directories (defect S3) ----------
        function Resolve-Dirs {
          param([string[]]$Candidates)
          $out = New-Object System.Collections.ArrayList
          foreach ($c in $Candidates) {
            if ([string]::IsNullOrWhiteSpace($c)) { continue }
            if (Test-Path -LiteralPath $c -PathType Container) { [void]$out.Add($c) }
          }
          return $out.ToArray()
        }

        # ---------------------------------------------------------------
        # Report file FIRST (defect S2): with the project's S3 artifacts a run
        # that produced nothing fails in UPLOAD_ARTIFACTS, which would mask the
        # real reason a gate went red.
        $outDir = Join-Path $PWD "artifacts\smoke"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        $report = Join-Path $outDir "smoke-report.txt"
        "AgentLens Windows installer smoke - started $(Get-Date -Format o)" |
          Set-Content -Encoding ascii $report
        function Note([string]$line) {
          Write-Host $line
          Add-Content -Encoding ascii -Path $report -Value $line
        }

        Note "=== [0/9] inputs and host facts ==="
        if ([string]::IsNullOrWhiteSpace($env:SMOKE_ARTIFACT_BUCKET)) {
          throw "SMOKE_ARTIFACT_BUCKET is empty - pass it via --environment-variables-override"
        }
        if ([string]::IsNullOrWhiteSpace($env:SMOKE_ARTIFACT_KEY)) {
          throw "SMOKE_ARTIFACT_KEY is empty - pass it via --environment-variables-override"
        }
        Note ("artifact     : s3://{0}/{1}" -f $env:SMOKE_ARTIFACT_BUCKET, $env:SMOKE_ARTIFACT_KEY)
        # Pure .NET, not whoami.exe / CIM (defect S7): a diagnostic must not be
        # able to kill the run before the first gate.
        Note ("identity     : {0}" -f [Security.Principal.WindowsIdentity]::GetCurrent().Name)
        Note ("os version   : {0}" -f [Environment]::OSVersion.VersionString)
        Note ("ps version   : {0}" -f $PSVersionTable.PSVersion.ToString())
        Note ("LOCALAPPDATA : {0}" -f $env:LOCALAPPDATA)
        Note ("APPDATA      : {0}" -f $env:APPDATA)
        Note ("USERPROFILE  : {0}" -f $env:USERPROFILE)
        Note ("SRC_DIR      : {0}" -f $env:CODEBUILD_SRC_DIR)
        try {
          Note ("os caption   : {0}" -f (Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).Caption)
        } catch {
          Note ("os caption   : unavailable ({0})" -f $_.Exception.GetType().Name)
        }

        # ---- resolve an S3 fetcher (defect S6) ----------------------------
        $awsExe = $null
        $tried = New-Object System.Collections.ArrayList
        $c = Get-Command aws -ErrorAction SilentlyContinue
        if ($c) { $awsExe = $c.Source } else { [void]$tried.Add("PATH lookup of 'aws'") }
        if (-not $awsExe) {
          foreach ($p in @(
            "C:\Program Files\Amazon\AWSCLIV2\aws.exe",
            "C:\Program Files (x86)\Amazon\AWSCLIV2\aws.exe",
            "C:\Program Files\Amazon\AWSCLI\bin\aws.exe",
            "C:\ProgramData\chocolatey\bin\aws.exe"
          )) {
            [void]$tried.Add($p)
            if (Test-Path -LiteralPath $p) { $awsExe = $p; break }
          }
        }
        $s3Mode = $null
        if ($awsExe) {
          $s3Mode = "cli"
          Note ("aws cli      : {0}" -f $awsExe)
          & $awsExe --version
          Assert-Ok "aws --version"
        } elseif (Get-Command Read-S3Object -ErrorAction SilentlyContinue) {
          $s3Mode = "powershell"
          Note "aws cli      : NOT FOUND - falling back to Read-S3Object (AWS Tools for PowerShell)"
        } else {
          throw ("GATE FAILED: no way to read S3 in this container. Tried: {0}; and Read-S3Object is not available either." -f ($tried -join ", "))
        }

        # ---------------------------------------------------------------
        Note "=== [1/9] download the already-built installer ==="
        $work = "C:\smoke"
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        $zip = Join-Path $work "artifact.zip"
        if ($s3Mode -eq "cli") {
          & $awsExe s3 cp ("s3://{0}/{1}" -f $env:SMOKE_ARTIFACT_BUCKET, $env:SMOKE_ARTIFACT_KEY) $zip --no-progress
          Assert-Ok "aws s3 cp artifact"
        } else {
          Read-S3Object -BucketName $env:SMOKE_ARTIFACT_BUCKET -Key $env:SMOKE_ARTIFACT_KEY -File $zip | Out-Null
        }
        if (-not (Test-Path -LiteralPath $zip)) { throw "GATE FAILED: the artifact download produced no file at $zip" }
        $zipInfo = Get-Item -LiteralPath $zip
        Note ("artifact.zip : {0} bytes" -f $zipInfo.Length)
        Note ("artifact sha : {0}" -f (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower())

        $pkg = Join-Path $work "pkg"
        Expand-Archive -LiteralPath $zip -DestinationPath $pkg -Force
        Note "--- artifact contents ---"
        Get-ChildItem -LiteralPath $pkg -Recurse -File |
          ForEach-Object { Note ("{0,12}  {1}" -f $_.Length, $_.FullName.Substring($pkg.Length + 1)) }

        # -Recurse, not a top-level glob (defect S8), and the count is printed so
        # "not found" can never be confused with "found the wrong one".
        $setupAll = @(Get-ChildItem -LiteralPath $pkg -Recurse -File -Filter "*-setup.exe" -ErrorAction SilentlyContinue)
        Note ("*-setup.exe matches in the zip: {0}" -f $setupAll.Count)
        if ($setupAll.Count -eq 0) { throw "GATE FAILED: no *-setup.exe inside the artifact zip" }
        $setup = $setupAll[0]
        $setupHash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLower()
        Note ("installer    : {0}" -f $setup.Name)
        Note ("installer sz : {0} bytes" -f $setup.Length)
        Note ("installer sha: {0}" -f $setupHash)
        Gate-Ok ("an installer exists in the shipped artifact: {0}" -f $setup.Name)

        # ---------------------------------------------------------------
        Note "=== [2/9] the shipped sha256sums.txt must describe these bytes ==="
        # Guards against the release page advertising a checksum that no longer
        # matches the file next to it.
        $sumsFile = Get-ChildItem -LiteralPath $pkg -Recurse -File -Filter "sha256sums.txt" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
        if (-not $sumsFile) { throw "GATE FAILED: sha256sums.txt missing from artifact" }
        $sums = @(Get-Content -LiteralPath $sumsFile.FullName)
        foreach ($s in $sums) { Note ("  manifest row: {0}" -f $s) }
        $line = $sums | Where-Object { $_ -match [regex]::Escape($setup.Name) } | Select-Object -First 1
        if (-not $line) { throw "GATE FAILED: sha256sums.txt has no row for $($setup.Name)" }
        $claimed = (($line.Trim() -split '\s+') | Where-Object { $_ -ne "" })[0].ToLower()
        if ($claimed -ne $setupHash) {
          throw "GATE FAILED: sha256 mismatch - manifest says $claimed, file is $setupHash"
        }
        Gate-Ok "installer sha256 matches the shipped manifest"

        # ---------------------------------------------------------------
        Note "=== [3/9] pre-install state (so 'appeared' is provable) ==="
        function Get-AgentLensUninstallEntries {
          # Literal registry roots, each Test-Path guarded. Tauri v2 NSIS
          # defaults to installMode=currentUser, so the entry is expected under
          # HKCU; HKLM is probed anyway rather than assumed absent.
          $roots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            Get-ChildItem $r -ErrorAction SilentlyContinue | ForEach-Object {
              $p = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
              if ($p.DisplayName -like "*AgentLens*" -or $_.PSChildName -like "*agentlens*") {
                [pscustomobject]@{
                  Key             = $_.PSPath -replace '^Microsoft\.PowerShell\.Core\\Registry::', ''
                  DisplayName     = $p.DisplayName
                  DisplayVersion  = $p.DisplayVersion
                  InstallLocation = $p.InstallLocation
                  UninstallString = $p.UninstallString
                }
              }
            }
          }
        }
        $before = @(Get-AgentLensUninstallEntries)
        Note ("uninstall entries before install: {0}" -f $before.Count)
        # Tauri v2 NSIS installMode default is currentUser => %LOCALAPPDATA%.
        # perMachine would land in C:\Program Files. Both are probed; the mode is
        # not asserted, because it is a Tauri default rather than our contract.
        $rootCandidates = @($env:LOCALAPPDATA, "C:\Program Files", "C:\Program Files (x86)", $env:ProgramData)
        $roots = Resolve-Dirs -Candidates $rootCandidates
        Note ("probe roots that exist: {0}" -f ($roots -join " | "))
        foreach ($root in $roots) {
          $d = Join-Path $root "AgentLens"
          Note ("  {0} exists={1}" -f $d, (Test-Path -LiteralPath $d))
        }

        # ---------------------------------------------------------------
        Note "=== [4/9] SILENT INSTALL (/S) - first execution ever ==="
        # -Wait + -PassThru is the only way to get an NSIS exit code: a bare
        # invocation returns before the installer finishes.
        # NOTE the wall time. Tauri's NSIS defaults to
        # webviewInstallMode=downloadBootstrapper, so a cold container may spend
        # most of this step fetching the WebView2 runtime from the internet.
        $t0 = Get-Date
        $proc = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
        $installExit = $proc.ExitCode
        $installSecs = ((Get-Date) - $t0).TotalSeconds
        Note ("installer exit code : {0}" -f $installExit)
        Note ("installer wall time : {0:N1}s" -f $installSecs)
        if ($installExit -ne 0) { throw "GATE FAILED: silent install exited $installExit" }
        Gate-Ok "silent install exit 0"

        # Tauri's NSIS may launch the app on success. In a container it cannot
        # render, but a lingering process would block the uninstall, so reap it.
        Start-Sleep -Seconds 3
        Get-Process -Name "AgentLens" -ErrorAction SilentlyContinue | ForEach-Object {
          Note ("reaping leftover AgentLens pid {0}" -f $_.Id)
          Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
        }

        # ---------------------------------------------------------------
        Note "=== [5/9] installed layout ==="
        # ROUND 1 MEASURED THE HARD WAY (build 0e95cd18): the shipped main binary
        # is NOT AgentLens.exe. `mainBinaryName` is unset in tauri.conf.json, so
        # Tauri v2 keeps the CARGO BIN NAME and installs `agentlens-tauri.exe`,
        # while the Start Menu shortcut is still AgentLens.lnk. The draft's
        # hardcoded "AgentLens.exe" therefore produced a FALSE RED, and the
        # fallback then recursively walked all of C:\Program Files looking for a
        # file that cannot exist. Confirmed independently by LZMA-decoding the
        # installer payload, which carries `\agentlens-tauri.exe`, `\uninstall.exe`
        # and `\AgentLens.lnk` side by side.
        # So: resolve the DIRECTORY authoritatively, then IDENTIFY the main binary
        # instead of guessing its file name. The gate is now "a shipped app binary
        # that identifies itself as AgentLens exists", which survives a rename.
        $installDir = $null
        foreach ($e in @(Get-AgentLensUninstallEntries)) {
          if ($e.InstallLocation -and (Test-Path -LiteralPath $e.InstallLocation -PathType Container)) {
            $installDir = $e.InstallLocation.TrimEnd('\')
            Note ("install dir from registry InstallLocation: {0}" -f $installDir)
            break
          }
        }
        if (-not $installDir) {
          foreach ($root in $roots) {
            $cand = Join-Path $root "AgentLens"
            if (Test-Path -LiteralPath $cand -PathType Container) {
              $installDir = $cand
              Note ("install dir by direct probe: {0}" -f $installDir)
              break
            }
          }
        }
        if (-not $installDir) {
          # Bounded, NOT -Recurse over Program Files (defect S4): a directory
          # search two levels deep, which is where every install mode puts it.
          Note "!! no <root>\AgentLens directory and no registry InstallLocation; bounded widening"
          if ($roots.Count -gt 0) {
            $hit = Get-ChildItem -Path $roots -Filter "AgentLens" -Directory -Depth 2 `
                     -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $installDir = $hit.FullName }
          }
        }
        if (-not $installDir) { throw "GATE FAILED: install reported success but no install directory exists under $($roots -join ', ')" }
        Note "--- installed tree ---"
        Get-ChildItem -LiteralPath $installDir -Recurse -File |
          ForEach-Object { Note ("{0,12}  {1}" -f $_.Length, $_.FullName.Substring($installDir.Length + 1)) }

        # The main binary is the top-level exe that is neither the uninstaller nor
        # the askpass sidecar. Its identity is then confirmed from its OWN version
        # resource, so this gate cannot be satisfied by an unrelated exe.
        $exes = @(Get-ChildItem -LiteralPath $installDir -File -Filter "*.exe" -ErrorAction SilentlyContinue)
        Note ("top-level exe files: {0}" -f (($exes | ForEach-Object { $_.Name }) -join ", "))
        $mains = @($exes | Where-Object { $_.Name -notlike "uninstall*" -and $_.Name -notlike "agentlens-askpass*" })
        if ($mains.Count -eq 0) { throw "GATE FAILED: the install directory $installDir has no app binary (only $(($exes | ForEach-Object { $_.Name }) -join ', '))" }
        $installed = $mains | Where-Object { $_.VersionInfo.ProductName -eq "AgentLens" } | Select-Object -First 1
        if (-not $installed) { $installed = $mains[0] }
        $vi = $installed.VersionInfo
        Note ("main binary  : {0} ({1} bytes)" -f $installed.Name, $installed.Length)
        Note ("version info : FileVersion='{0}' ProductVersion='{1}' ProductName='{2}' Company='{3}'" -f $vi.FileVersion, $vi.ProductVersion, $vi.ProductName, $vi.CompanyName)
        if ($vi.ProductName -ne "AgentLens") {
          throw "GATE FAILED: the installed app binary $($installed.Name) reports ProductName='$($vi.ProductName)', not 'AgentLens'"
        }
        Gate-Ok ("the installed app binary is present and self-identifies as AgentLens: {0}" -f $installed.Name)

        # The remote collectors are the reason this app can touch other hosts at
        # all, and askpass is how it answers an SSH password prompt; shipping the
        # installer without any of them is a silent capability loss.
        # agentlens-askpass is matched by WILDCARD on purpose: the gate must fire
        # on absence, not on a guess about whether the bundler keeps the target
        # triple in the installed name.
        $needed = @(
          "agentlens-collector-x86_64-unknown-linux-musl",
          "agentlens-collector-aarch64-unknown-linux-musl",
          "collectors.sha256",
          "agentlens-askpass*"
        )
        foreach ($n in $needed) {
          $hit = Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter $n -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $hit) { throw "GATE FAILED: installed tree is missing $n" }
          Note ("  present: {0} -> {1} ({2} bytes)" -f $n, $hit.Name, $hit.Length)
        }
        Gate-Ok "both collectors, collectors.sha256 and askpass are installed"

        # ---------------------------------------------------------------
        Note "=== [6/9] collector checksums survive packaging ==="
        # The app verifies these before pushing a collector to a remote host, so
        # a byte flip during bundling would break remote collection at run time.
        $manifest = Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter "collectors.sha256" |
                    Select-Object -First 1
        $bad = 0
        $checked = 0
        foreach ($row in (Get-Content -LiteralPath $manifest.FullName)) {
          if ([string]::IsNullOrWhiteSpace($row)) { continue }
          $parts = $row -split '\s+' | Where-Object { $_ -ne "" }
          if ($parts.Count -lt 2) { continue }
          $want = $parts[0].ToLower()
          $name = Split-Path ($parts[-1] -replace '^\*', '') -Leaf
          $file = Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $file) { Note ("  MISSING {0}" -f $name); $bad++; continue }
          $checked++
          $got = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) {
            Note ("  MISMATCH {0} manifest={1} ondisk={2}" -f $name, $want, $got)
            $bad++
          } else {
            Note ("  ok {0}  {1}" -f $name, $got)
          }
        }
        if ($bad -ne 0) { throw "GATE FAILED: $bad collector checksum problem(s) after install" }
        if ($checked -eq 0) { throw "GATE FAILED: collectors.sha256 verified nothing - the manifest parsed to zero rows" }
        Gate-Ok ("all {0} collector checksum rows match after install" -f $checked)

        # ---------------------------------------------------------------
        Note "=== [7/9] registry, shortcuts, icon, launch probe ==="
        $after = @(Get-AgentLensUninstallEntries)
        Note ("uninstall entries after install: {0} (before: {1})" -f $after.Count, $before.Count)
        $after | ForEach-Object { Note ($_ | Format-List | Out-String) }
        # A delta, not a guessed shape: installing MUST make the app appear in
        # Add/Remove Programs somewhere, or the user cannot uninstall it.
        if ($after.Count -le $before.Count) {
          throw "GATE FAILED: install created no Add/Remove Programs entry (before=$($before.Count) after=$($after.Count))"
        }
        Gate-Ok "install registered an Add/Remove Programs entry"

        # Shortcut placement is REPORTED, NOT GATED: it is a Tauri/NSIS
        # implementation detail, and asserting a guessed location would fail on
        # an upstream change rather than on a defect.
        # Built imperatively: `(if ...)` is a PARSE ERROR in PowerShell - `if` is a
        # statement, so it cannot appear inside plain grouping parentheses. And
        # Join-Path on a null base throws, which is defect S3 all over again.
        $scCandidates = New-Object System.Collections.ArrayList
        if (-not [string]::IsNullOrWhiteSpace($env:APPDATA)) {
          [void]$scCandidates.Add((Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"))
        }
        [void]$scCandidates.Add("C:\ProgramData\Microsoft\Windows\Start Menu\Programs")
        if (-not [string]::IsNullOrWhiteSpace($env:USERPROFILE)) {
          [void]$scCandidates.Add((Join-Path $env:USERPROFILE "Desktop"))
        }
        [void]$scCandidates.Add("C:\Users\Public\Desktop")
        $shortcutRoots = Resolve-Dirs -Candidates $scCandidates.ToArray()
        $scCount = 0
        foreach ($sm in $shortcutRoots) {
          Get-ChildItem -LiteralPath $sm -Recurse -Filter "*AgentLens*" -ErrorAction SilentlyContinue |
            ForEach-Object { Note ("  shortcut: {0}" -f $_.FullName); $scCount++ }
        }
        Note ("shortcuts found: {0} (reported, not gated)" -f $scCount)

        # WebView2 runtime, REPORTED: Tauri's NSIS defaults to
        # downloadBootstrapper, so a silent install on a machine without the
        # runtime reaches out to the internet. Whether that happened is worth
        # knowing; it is not gated, because this container is not a user machine.
        $wvKeys = @(
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
          "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
        )
        $wv = "not present"
        foreach ($k in $wvKeys) {
          if (Test-Path $k) {
            $pv = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
            if ($pv) { $wv = $pv; break }
          }
        }
        Note ("WebView2 runtime version: {0} (reported, not gated)" -f $wv)

        # ---- icon frames in the INSTALLED binary (reported, not gated) ----
        # The installer's own PE RT_ICON table is the NSIS stub's icon and gives
        # a FALSE NEGATIVE. The installed app binary is different: its RT_ICON
        # payloads are the app's real frames, stored verbatim from the .ico, so a
        # plain byte search over the exe settles the question with no resource
        # parsing and no P/Invoke. Not gated on this first run: a miss here would
        # more likely mean this search is wrong than that the icon is.
        $icoFound = -1
        $icoTotal = -1
        try {
          $icoPath = $null
          foreach ($base in @($env:CODEBUILD_SRC_DIR, $PWD.Path)) {
            if ([string]::IsNullOrWhiteSpace($base)) { continue }
            $p = Join-Path $base "src-tauri\icons\icon.ico"
            if (Test-Path -LiteralPath $p -PathType Leaf) { $icoPath = $p; break }
          }
          if (-not $icoPath) {
            Note "icon check   : src-tauri\icons\icon.ico not in the source tree - skipped"
          } else {
            $enc = [Text.Encoding]::GetEncoding(28591)
            $ico = [IO.File]::ReadAllBytes($icoPath)
            $exeBytes = [IO.File]::ReadAllBytes($installed.FullName)
            $hay = $enc.GetString($exeBytes)
            $icoTotal = [BitConverter]::ToUInt16($ico, 4)
            $icoFound = 0
            for ($i = 0; $i -lt $icoTotal; $i++) {
              $e = 6 + (16 * $i)
              $w = $ico[$e]; $h = $ico[$e + 1]
              $len = [BitConverter]::ToInt32($ico, $e + 8)
              $off = [BitConverter]::ToInt32($ico, $e + 12)
              $needle = $enc.GetString($ico, $off, $len)
              $at = $hay.IndexOf($needle)
              if ($at -ge 0) { $icoFound++ }
              Note ("  icon frame {0}: {1}x{2} {3} bytes -> {4}" -f $i, $w, $h, $len, $(if ($at -ge 0) { "FOUND at 0x" + $at.ToString("X") } else { "not found" }))
            }
            Note ("icon frames in the installed {0}: {1}/{2} (reported, not gated)" -f $installed.Name, $icoFound, $icoTotal)
          }
        } catch {
          Note ("icon check   : failed ({0}) - reported, not gated" -f $_.Exception.Message)
        }

        # ---- launch probe (never gates) -----------------------------------
        # Informative even headless: it exercises the PE import table.
        # 0xC0000135 STATUS_DLL_NOT_FOUND or 0xC0000139
        # STATUS_ENTRYPOINT_NOT_FOUND would mean a genuinely broken package.
        # Anything else here is NOT evidence about the GUI, because this
        # container has no compositor to render into.
        Note "--- launch probe (never gates) ---"
        $probe = "not attempted"
        try {
          $app = Start-Process -FilePath $installed.FullName -PassThru -ErrorAction Stop
          Start-Sleep -Seconds 8
          if ($app.HasExited) {
            $ec = $app.ExitCode
            $probe = ("exited with {0} (0x{1:X8}) in under 8s" -f $ec, $ec)
            if ($ec -eq -1073741515) { $probe += "  <== 0xC0000135 STATUS_DLL_NOT_FOUND: REAL PACKAGING DEFECT" }
            if ($ec -eq -1073741511) { $probe += "  <== 0xC0000139 STATUS_ENTRYPOINT_NOT_FOUND: REAL PACKAGING DEFECT" }
          } else {
            $probe = "still running after 8s (process created, imports resolved)"
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
        } catch {
          $probe = ("could not start: {0}" -f $_.Exception.Message)
        }
        Note ("launch probe : {0}" -f $probe)
        Get-Process -Name "AgentLens" -ErrorAction SilentlyContinue |
          ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
        Start-Sleep -Seconds 2

        # ---------------------------------------------------------------
        Note "=== [8/9] SILENT UNINSTALL ==="
        # `_?=<dir>` makes the NSIS uninstaller run IN PLACE and actually wait.
        # Without it NSIS copies itself to %TEMP% and returns immediately, so the
        # exit code would describe the copy, not the uninstall.
        # ONE pre-quoted argument string (defect S5): PowerShell 5.1 joins
        # ArgumentList with spaces WITHOUT quoting, so a two-element form breaks
        # on any install dir containing a space. TrimEnd('\') because NSIS
        # rejects a trailing backslash in `_?=`.
        $uninstArg = '/S "_?=' + $installDir.TrimEnd('\') + '"'
        $uninst = Get-ChildItem -LiteralPath $installDir -File -Filter "uninstall*.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
        if (-not $uninst) {
          Note "!! no uninstall*.exe in the install dir; falling back to the registry UninstallString"
          $us = ($after | Where-Object { $_.UninstallString } | Select-Object -First 1).UninstallString
          if (-not $us) { throw "GATE FAILED: neither an uninstaller exe nor an UninstallString exists" }
          Note ("  UninstallString: {0}" -f $us)
          $exe = $us.Trim('"')
          $u = Start-Process -FilePath $exe -ArgumentList $uninstArg -Wait -PassThru
        } else {
          Note ("uninstaller : {0}" -f $uninst.FullName)
          Note ("uninstall args: {0}" -f $uninstArg)
          $u = Start-Process -FilePath $uninst.FullName -ArgumentList $uninstArg -Wait -PassThru
        }
        Note ("uninstaller exit code: {0}" -f $u.ExitCode)
        if ($u.ExitCode -ne 0) { throw "GATE FAILED: silent uninstall exited $($u.ExitCode)" }
        Gate-Ok "silent uninstall exit 0"

        Start-Sleep -Seconds 3
        # The real signal is that the APP is gone. With `_?=` NSIS cannot delete
        # its own uninstaller, so a surviving uninstall.exe is expected, not a leak.
        if (Test-Path -LiteralPath $installed.FullName) {
          throw "GATE FAILED: $($installed.Name) still present after uninstall: $($installed.FullName)"
        }
        Gate-Ok ("the app binary was removed by the uninstaller: {0}" -f $installed.Name)

        if (Test-Path -LiteralPath $installDir) {
          Note "--- residue left in the install dir ---"
          $residue = @(Get-ChildItem -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue)
          foreach ($r in $residue) { Note ("  {0}" -f $r.FullName) }
          # Reported, not gated: with `_?=` the uninstaller cannot remove itself,
          # so SOME residue is expected by construction. What would be a real
          # finding is a leftover collector or askpass binary - called out here
          # by name so it cannot hide in the list.
          $leftBinaries = @($residue | Where-Object {
            $_.PSIsContainer -eq $false -and (
              $_.Name -like "agentlens-collector*" -or
              $_.Name -like "agentlens-askpass*" -or
              $_.Name -eq "collectors.sha256"
            )
          })
          Note ("residue entries: {0}; leftover shipped payload files: {1} (reported, not gated)" -f $residue.Count, $leftBinaries.Count)
          foreach ($lb in $leftBinaries) { Note ("  LEFTOVER PAYLOAD: {0}" -f $lb.FullName) }
        } else {
          Note "install dir fully removed"
        }

        $post = @(Get-AgentLensUninstallEntries)
        Note ("uninstall entries after uninstall: {0} (baseline was {1})" -f $post.Count, $before.Count)
        $post | ForEach-Object { Note ($_ | Format-List | Out-String) }
        if ($post.Count -ne $before.Count) {
          throw "GATE FAILED: uninstall did not remove the Add/Remove Programs entry (baseline=$($before.Count) now=$($post.Count))"
        }
        Gate-Ok "uninstall removed the Add/Remove Programs entry"

        # ---------------------------------------------------------------
        Note "=== [9/9] summary ==="
        # The count is produced by this script, not by grepping the log for a
        # string that CodeBuild also echoes from this file (defect S9).
        Note ("SMOKE-GATE-TOTAL {0}/{1}" -f $script:GateN, $GATE_TOTAL)
        if ($script:GateN -ne $GATE_TOTAL) {
          throw "GATE FAILED: only $($script:GateN) of $GATE_TOTAL gates ran - a gate was skipped, which means the run proves less than it claims"
        }
        Note ""
        Note "PROVED   : the shipped bytes are downloadable, checksum-honest,"
        Note "           silently installable, land a correct installed layout"
        Note "           (app binary + askpass + both collectors + manifest),"
        Note "           keep every collector byte-intact through bundling,"
        Note "           register in Add/Remove Programs, uninstall silently,"
        Note "           and remove both the app binary and the registry entry."
        Note "NOT PROVED: anything visual or interactive. No DWM, no explorer.exe,"
        Note "           no desktop session in this container - so window"
        Note "           rendering, the undecorated frame, title-bar drag, the"
        Note "           three window buttons, double-click-maximize, the"
        Note "           taskbar/Explorer icon and SmartScreen all remain"
        Note "           unverified and need a real Windows desktop."
        Note "Windows installer smoke complete."
        } finally {
          $ErrorActionPreference = "Continue"
          Write-Host "reset ErrorActionPreference (defect H)"
        }

artifacts:
  # base-directory is the OUTPUT dir, not the repo root -- see defect (I).
  # The section exists at all because of defect (S2): with the project's S3
  # artifacts, a buildspec that uploads nothing fails the run at
  # UPLOAD_ARTIFACTS even when every gate passed.
  files:
    - "**/*"
  name: agentlens-windows-installer-smoke
  base-directory: artifacts/smoke
