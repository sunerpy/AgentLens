name: release

# ===========================================================================
# 发布流水线：manifest 版本驱动，draft-until-all-green。
#
# 形态：
#   push main ──▶ prepare      (manifest 版本 vs 已有 tag，判定是否发布)
#                    │ should_release == 'true'
#                    ▼
#                 create-draft (建 tag 与 draft Release)
#         ┌──────────┼────────────┬────────────┐
#         ▼          ▼            ▼            ▼
#      verify-ci  linux-deb   windows-nsis  macos-dmg   查询 CI 与构建并行
#         └──────────┴────────────┼────────────┘
#                                ▼
#                             publish  ← CI + 三平台都绿才公开 Release
#
#   旁路：release-please 只维护发布 PR（版本号 / 变更日志），不建 Release。
#
# ---- tag 由谁创建：本仓库权限下唯一可行的那条路 -------------------------
# 默认 GITHUB_TOKEN 在本仓库能把 tag / Release 指到 main 的**当前 tip**，但不能指
# 到任意历史提交。这不是猜测，是在本仓库用同一个 token 实测出来的（见
# .github/workflows 历史里的临时排障 workflow，已删除）：
#
#   POST /releases  target_commitish 省略（默认 main）        -> 201
#   POST /releases  target_commitish = main（分支名）          -> 201
#   POST /releases  target_commitish = 当前 tip 的 SHA        -> 201
#   POST /releases  target_commitish = 陈旧提交 969e303 的 SHA -> 403
#   POST /git/refs  sha = 当前 tip                            -> 201
#   POST /git/refs  sha = 陈旧提交 969e303                     -> 403
#
# 403 的响应头是 `x-accepted-github-permissions: contents=write;
# contents=write,workflows=write` —— 指向任意 SHA 的那一支要求 workflows=write，
# 而 workflows 根本不是 GITHUB_TOKEN 可申请的权限，无论 job 里怎么写 permissions
# 都拿不到。仓库侧已逐项排除：Actions 默认权限 write、无分支保护、无 tag 保护、
# 无 ruleset、非 archived、个人 public 非 fork。
#
# release-please 的 createRelease 恒定发送 `target_commitish: release.sha`
# （release-please src/github-api.ts），而 release.sha 是**发布 PR 的合并提交**。
# 只要那个提交还是 main 的 tip，它就能发（同账户的 pt-tools 一直如此，所以那边用
# 默认 token 就能发版）。可一旦发布因别的原因失败、main 又往前走了，这个 SHA 就
# 永远陈旧，之后每一次重试都必然 403 —— 本仓库的 0.0.1 正是卡死在这里：
#
#   ✔ Creating 1 releases for pull #17
#   ##[error]release-please failed: Resource not accessible by integration
#             - https://docs.github.com/rest/releases/releases#create-a-release
#
# 而且没有任何 release-please 配置能改掉那个 target_commitish。所以本文件把发布权
# 收回来：release-please 只留 PR / 版本号 / 变更日志（skip-github-release: true），
# tag 与 draft Release 由 create-draft 显式建在 prepare 选定的提交上。
#
# 为什么坚持 draft 而不学 pt-tools 直接建正式 Release：
#   pt-tools 由 release-please 直接建非 draft Release、产物随后追加。那样 Release
#   公开的瞬间资产还是空的，要等二十多分钟三平台才补齐 —— 这个窗口里用户会下载到
#   一个没有安装包的 Release。本项目的取舍相反：宁可晚发布，也不发一个残包。
#
# 产物不齐时会发生什么：Release 停在 draft，不公开、不进 releases/latest，
# install.sh 取不到它，缺哪个平台从 Actions 页面一眼可见。副产物是一个已存在但
# 没有公开 Release 的 tag —— 无害，且下一次运行会被 prepare 认成「续做」，锁定同
# 一个提交继续补齐，不会另起一个版本。修完重跑失败 job 或再推一次都可以。
#
# 版本号：唯一事实源是 .release-please-manifest.json，release-please 在发布 PR 里
# 同步写入根 Cargo.toml 的 [workspace.package].version 与 frontend/package.json
# （见 release-please-config.json 的 extra-files）。本文件只读 manifest 推出 tag，
# 从不硬编码第二份版本，构建步骤只回显 `make dist-version`。
#
# ---- 从 .github/workflows/ci.yml 原样承接的五条硬约束 --------------------
# (1) 每条 native 命令后跟 Assert-Ok：pwsh 里 native 命令非零退出**不会**中断
#     脚本，而 GitHub 注入的 $LASTEXITCODE 检查只反映**最后一条**命令。
# (2) 每个 `shell: pwsh` 的 run 块严格 ASCII-only：PS 5.1 按 ANSI 解析文件，
#     一个非 ASCII 字符就会撕裂字符串字面量，job 在 1s 内无错误文本地死掉。
#     step 名与 YAML 注释可以是中文 —— 它们不进 pwsh 解析器。
# (3) 绝不设置 $ErrorActionPreference：GitHub 会前置 Stop。
# (4) 绝不在 pwsh 里给 cargo 套 2>&1：叠加 (3) 的 Stop 后，cargo 往 stderr 打的
#     `Updating crates.io index` 这类普通噪声会变成终止性 NativeCommandError。
# (5) macOS 打 dmg 必须 CI == "true"：tauri-bundler 只有在 CI 为 true 时才给
#     hdiutil 传 --skip-jenkins，否则 osascript 在无头环境下以 64 退出。
#
# 另外：本文件任何构建/门禁步骤都没有 `|| true`，也没有 continue-on-error。
# 把失败洗成绿正是本项目已经修过一次的缺陷。
# ===========================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# 发布流程不允许被后一次 push 取消：中途取消会留下一个装了一半产物的 draft。
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # bash 在三个 runner 上都可用（Windows 走 Git bash），GitHub 以
    # `bash --noprofile --norc -eo pipefail {0}` 运行它 —— 非零退出即失败。
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "22"
  # 与 ci.yml 及三份 buildspec 同一枚举：0.14.0 是实测跑绿的那个。
  ZIG_VERSION: "0.14.0"
  # 必须与 ci.yml 的 TAURI_CLI_VERSION 逐字一致：发布产物与门禁产物要出自同一个
  # bundler。装的是官方预编译二进制，URL 含版本号，所以只能钉死具体版本。
  TAURI_CLI_VERSION: "2.11.4"
  MACOS_TARGET: aarch64-apple-darwin
  MACOS_BUNDLE_CONFIG: src-tauri/tauri.bundle.macos.json
  # git-cliff 只用来生成 Release 正文，钉死版本避免新版改模板渲染。
  GIT_CLIFF_VERSION: "2.13.1"
  # 约束 (5)：显式钉住，不依赖 runner 默认值。
  CI: "true"

jobs:
  # ---- 阶段 1：判定本次是否需要发布 ---------------------------------------
  # 版本号唯一事实源是 .release-please-manifest.json（release-please 在发布 PR 里
  # 写它，同时把同一个版本写进 Cargo.toml 与 frontend/package.json）。本 job 只做
  # 一件事：把「manifest 声明的版本」与「远端已有的 tag / Release」比对，得出
  # 本次要不要发布、以及发布哪个提交。
  #
  # 判定规则（idempotent，可以安全重跑）：
  #   已有该 tag 的**正式** Release  → should_release=false，什么都不做
  #   已有该 tag 但只是 draft/裸 tag → should_release=true，sha 取 **tag 指向的提交**
  #                                    （续做那次没做完的发布，产物与 tag 永远一致）
  #   没有该 tag                     → should_release=true，sha 取本次 push 的 tip
  #
  # 为什么必须自己判定、而不是用 release-please 的 releases_created：
  # 见文件头 "tag 由谁创建" 一节 —— release-please 永远把 Release 打在发布 PR 的
  # 合并提交上，而那个提交一旦不再是 main 的 tip 就再也发不出去，本仓库的 0.0.1
  # 正是卡在这里。所以 release-please 只保留 PR/版本号/变更日志职责
  # （release-please-config.json 的 skip-github-release: true），发布权收回本文件。
  prepare:
    name: 判定是否需要发布（manifest 版本 vs 已有 tag）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag_name: ${{ steps.decide.outputs.tag_name }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          version="$(jq -er '."."' .release-please-manifest.json)"
          tag="v${version}"
          echo "manifest 版本 = ${version}，目标 tag = ${tag}"

          # 两次查询都可能合法地 404（首次发布时 tag 与 Release 都还不存在），
          # 但只有 404 算「不存在」：其余错误（限流、权限、网络）必须让 job 变红，
          # 否则会被误判成首次发布而重复建 tag。所以不写 `|| true`，逐一分辨。
          probe() {
            if gh api "$1" --jq "$2" > /tmp/probe.out 2>/tmp/probe.err; then
              cat /tmp/probe.out
              return 0
            fi
            grep -q 'HTTP 404' /tmp/probe.err \
              || { echo "查询 $1 失败（非 404）：" >&2; cat /tmp/probe.err >&2; exit 1; }
            return 0
          }

          tag_sha="$(probe "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" '.object.sha')"
          published="$(probe "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            'if .draft then "draft" else "published" end')"

          echo "远端 tag  = ${tag_sha:-<none>}"
          echo "远端 Release = ${published:-<none>}"

          if [ "$published" = 'published' ]; then
            echo "${tag} 已是正式 Release，本次无需发布"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$tag_sha" ]; then
            sha="$tag_sha"
            echo "续做 ${tag} 未完成的发布，锁定 tag 指向的提交 ${sha}"
          else
            sha="$HEAD_SHA"
            echo "${tag} 尚不存在，将把它建在本次 push 的 tip ${sha}"
          fi

          {
            echo "should_release=true"
            echo "version=${version}"
            echo "tag_name=${tag}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  # ---- 阶段 1b：建 tag 与 draft Release ------------------------------------
  # 这是文件头那条权限约束的落点：tag 由**本 job 显式创建**在 prepare 选定的提交
  # 上，而不是由 release-please 内部创建。默认 GITHUB_TOKEN 能 createRef 到
  # main 当前 tip，这一点已在本仓库实测（tip → 201，陈旧提交 → 403）。
  #
  # 两步都写成「先查，缺了才建」，所以整轮重跑不会因为已存在而失败。
  create-draft:
    name: 建 tag 与 draft Release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # 已存在同名 tag 时 GitHub 返回 422 already_exists —— 那正是 prepare 判定的
      # 续做场景，视为满足前置条件；其余非 201 一律失败，不做任何吞错。
      - name: 确保 tag 存在于选定提交
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"refs/tags/${TAG_NAME}\",\"sha\":\"${RELEASE_SHA}\"}")"
          cat /tmp/ref.json
          case "$code" in
            201)
              echo "已创建 refs/tags/${TAG_NAME} -> ${RELEASE_SHA}"
              ;;
            422)
              jq -e '.message | test("already exists"; "i")' /tmp/ref.json >/dev/null \
                || { echo "422 但不是 already exists，拒绝继续"; exit 1; }
              echo "refs/tags/${TAG_NAME} 已存在，续做发布"
              ;;
            *)
              echo "createRef 返回 HTTP ${code}，拒绝继续"
              exit 1
              ;;
          esac

          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
          if [ "$actual" != "$RELEASE_SHA" ]; then
            echo "tag 指向 ${actual}，与选定提交 ${RELEASE_SHA} 不一致"
            exit 1
          fi

      # --verify-tag 让 gh 在 tag 不存在时直接拒绝，避免它替我们隐式造 tag。
      # 正文此刻只放占位：真正的 Release 正文由 publish 用 git-cliff 生成后写入，
      # 保证「对外可见的正文」只在三平台齐全后出现一次。
      - name: 确保 draft Release 存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' > /tmp/state.txt 2>/dev/null; then
            grep -qx 'true' /tmp/state.txt \
              || { echo "${TAG_NAME} 已存在且不是 draft，拒绝在未知状态上继续"; exit 1; }
            echo "复用已有 draft ${TAG_NAME}"
          else
            gh release create "$TAG_NAME" \
              --draft \
              --verify-tag \
              --title "$VERSION" \
              --notes "构建中：三平台产物齐全后本正文会被 git-cliff 生成的变更日志替换。"
            echo "已创建 draft ${TAG_NAME}"
          fi
          gh release view "$TAG_NAME" --json isDraft,tagName,targetCommitish

  # ---- 阶段 2：查询发布提交对应的 CI 结论 ---------------------------------
  # 这里只读 Actions API，不重复 cargo/npm。它与三个构建 job 并行；唯一会把 draft
  # 公开的 publish 同时 needs 本 job 和三个构建，因此 CI 不成功时绝无公开 Release。
  # 定位对象是 prepare 选定的提交，也就是 tag 实际指向、三平台实际构建的那一个。
  verify-ci:
    name: 确认发布提交的 CI Success
    needs: [prepare, create-draft]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      actions: read
      contents: read
    steps:
      - name: 轮询同一 commit 的 CI Success（超时或非 success 即失败）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag_sha="${RELEASE_SHA}"
          test -n "$tag_sha" || { echo "prepare 未输出 sha，无法定位 CI run"; exit 1; }
          echo "待发布 ${TAG_NAME} -> ${tag_sha}"

          run_id=''
          for attempt in $(seq 1 120); do
            if [ -z "$run_id" ]; then
              run_id="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${DEFAULT_BRANCH}&event=push&per_page=100" \
                --jq ".workflow_runs | map(select(.head_sha == \"${tag_sha}\")) | sort_by(.run_attempt) | last | .id // empty")"
              if [ -n "$run_id" ]; then
                echo "找到 CI run ${run_id}（commit ${tag_sha}）"
              fi
            fi

            if [ -n "$run_id" ]; then
              job_state="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
                --jq '(.jobs | map(select(.name == "CI Success")) | last // empty) | "\(.status)|\(.conclusion // "")"')"
              status="${job_state%%|*}"
              conclusion="${job_state#*|}"

              if [ "$status" = 'completed' ]; then
                if [ "$conclusion" = 'success' ]; then
                  echo "CI Success 已通过（run ${run_id}，commit ${tag_sha}）"
                  exit 0
                fi
                echo "CI Success 结论为 ${conclusion:-<empty>}，拒绝公开 Release"
                exit 1
              fi

              case "$status" in
                ''|queued|in_progress|waiting|pending|requested)
                  echo "等待 CI Success：attempt=${attempt}/120 status=${status:-not-created}"
                  ;;
                *)
                  echo "CI Success 返回未知状态 ${status}，fail-closed"
                  exit 1
                  ;;
              esac
            else
              echo "等待 commit ${tag_sha} 的 CI push run：attempt=${attempt}/120"
            fi

            if [ "$attempt" -lt 120 ]; then
              sleep 60
            fi
          done

          echo "等待 CI Success 超时，拒绝公开 Release"
          exit 1

  # ---- 阶段 2a：Linux ------------------------------------------------------
  # 步骤与 ci.yml 的 Linux 分支逐条对应。dist-all == dist + 「aarch64 collector
  # 必须存在」的硬要求：本 job 是 aarch64 产物的权威构建点，缺席即失败，
  # 绝不静默产出单架构包。
  linux-deb:
    name: Linux deb + 双架构 musl collector
    needs: [prepare, create-draft]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # 钉 sha 而不是 tag：此刻 tag 尚未创建（publish 翻牌时才由 GitHub 建），
          # 用 tag 名会直接检出失败。sha 是发布 PR 的合并提交，即 Cargo.toml 被
          # release-please 写成目标版本的那一次提交，也不会随 main 前进而漂移。
          ref: ${{ needs.prepare.outputs.sha }}

      # 与 ci.yml / linux.yml 同一份包名清单。
      # libayatana-appindicator3-dev 必须有：src-tauri 打开了 tray-icon feature。
      # musl-tools 提供 musl-gcc（x86_64 collector 的 C 编译器）。
      - name: 安装 Tauri 2 系统依赖与 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev \
            musl-tools \
            curl file

      - name: 安装 Rust stable 与双 musl 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustc --version
          cargo --version

      # 纯只读地借用 ci.yml 存下的缓存：shared-key 必须与那边逐字相同（本 job 名与
      # gate 不同，不共用 shared-key 就永远命中不了），save-if: false 则保证发布链路
      # 一次都不写缓存 —— 发布是低频事件，写进去只会挤掉主干那三份热缓存。
      # 命不中也只是回到今天的全量编译，不影响正确性。
      - name: 只读复用 CI 的 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agentlens-gate
          cache-bin: "false"
          save-if: "false"

      # zig 只作为 musl 的 C 交叉编译器（rusqlite 的 bundled feature 要编 sqlite3.c）。
      # use-cache 关掉的理由见 ci.yml 同名步骤：cancelled run 会存下残缺的全局 zig 缓存，
      # 之后每个 job 恢复它并在链接期死掉；而实测保存耗时与安装同量级，本就不省时间。
      - name: 安装 zig（aarch64/x86_64 musl 的 C 交叉编译器）
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: "false"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（npm ci，lockfile 权威）
        run: npm --prefix frontend ci

      # 官方 release 的 cargo-tauri 二进制落进 ~/.cargo/bin，`cargo tauri build` 的调用
      # 方式与原先完全一致（Makefile 的 dist-bundle 直接依赖它）。解包后是扁平的四个
      # 文件（LICENSE x2 + README + 二进制），只取那个二进制。
      - name: 安装 tauri-cli v2（官方预编译，替代源码编译）
        run: |
          asset=cargo-tauri-x86_64-unknown-linux-gnu.tgz
          test "$RUNNER_ARCH" = 'X64' \
            || { echo "tauri-cli 没有 Linux-${RUNNER_ARCH} 的官方预编译资产"; exit 1; }
          work="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/$asset" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${asset}"
          tar xzf "$work/$asset" -C "$work" cargo-tauri
          install -m 0755 "$work/cargo-tauri" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version | tee "$work/version.txt"
          grep -qF "tauri-cli ${TAURI_CLI_VERSION}" "$work/version.txt" \
            || { echo "tauri-cli 实测版本与钉死的 ${TAURI_CLI_VERSION} 不符"; exit 1; }
          rm -rf "$work"

      - name: 回显版本号（单一事实源自检）
        run: make dist-version

      - name: 打包 deb + 双架构 musl collector（aarch64 缺席即失败）
        env:
          DIST_REQUIRE_AARCH64: "1"
          # 只传密钥内容本身；不要同时设置 *_PATH，也不要给 cargo tauri 传 -f。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" \
            || { echo '缺少 TAURI_SIGNING_PRIVATE_KEY，拒绝生成未签名发布包'; exit 1; }
          make dist-all

      - name: 校验 deb 载荷含 askpass 与双架构 collector
        run: |
          ls -l artifacts/dist/
          cat artifacts/dist/sha256sums.txt
          deb="$(ls -1 artifacts/dist/*.deb)"
          dpkg --contents "$deb" | tee /tmp/deb-contents.txt
          for expected in \
            usr/bin/agentlens-askpass \
            usr/bin/agentlens-collector-x86_64-unknown-linux-musl \
            usr/bin/agentlens-collector-aarch64-unknown-linux-musl
          do
            grep -q "$expected" /tmp/deb-contents.txt \
              || { echo "deb 缺少 ${expected}"; exit 1; }
          done

      # 三个平台都会产出名为 sha256sums.txt 的清单：直接上传会在同一个 Release 上
      # 撞名互相覆盖。改名后按平台隔离。两个 musl collector 只从本 job 上传
      # （它是 aarch64 的权威构建点），其余平台不重复上传同名二进制。
      - name: 归置发布资产（按平台隔离清单名）
        run: |
          mkdir -p upload
          cp artifacts/dist/*.deb upload/
          cp artifacts/dist/agentlens-collector-x86_64-unknown-linux-musl upload/
          cp artifacts/dist/agentlens-collector-aarch64-unknown-linux-musl upload/
          cp artifacts/dist/sha256sums.txt upload/sha256sums-linux.txt
          shopt -s nullglob
          signatures=(target/release/bundle/deb/*.deb.sig)
          test "${#signatures[@]}" -eq 1 \
            || { echo "Linux updater 签名数量应为 1，实际 ${#signatures[@]}"; exit 1; }
          test -s "${signatures[0]}" || { echo 'Linux updater 签名为空'; exit 1; }
          cp "${signatures[0]}" upload/
          test -n "$(ls -A upload)" || { echo "upload/ 为空，拒绝上传"; exit 1; }
          ls -l upload/

      - name: 上传资产到 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" upload/* --clobber

  # ---- 阶段 2b：Windows ---------------------------------------------------
  windows-nsis:
    name: Windows NSIS 安装包
    needs: [prepare, create-draft]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      # 必须在 checkout 之前：autocrlf 一旦生效工作区就被写成 CRLF；
      # core.longpaths 是 windows.yml 缺陷 (E) 的原样移植
      # （Tauri/MSVC 输出路径会超过 MAX_PATH）。
      - name: 固定行尾与长路径（必须在 checkout 之前）
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: 安装 Rust stable 与双 musl 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustc --version
          cargo --version

      # 纯只读地借用 ci.yml 存下的缓存：shared-key 必须与那边逐字相同（本 job 名与
      # gate 不同，不共用 shared-key 就永远命中不了），save-if: false 则保证发布链路
      # 一次都不写缓存 —— 发布是低频事件，写进去只会挤掉主干那三份热缓存。
      # 命不中也只是回到今天的全量编译，不影响正确性。
      - name: 只读复用 CI 的 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agentlens-gate
          cache-bin: "false"
          save-if: "false"

      # use-cache 关掉的理由见 ci.yml 同名步骤（cancelled run 会存下残缺的全局 zig 缓存）。
      - name: 安装 zig（musl 的 C 交叉编译器）
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: "false"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（npm ci，lockfile 权威）
        run: npm --prefix frontend ci

      # 与 ci.yml 的 Windows 分支逐条对应：Git bash 的 tar 是 GNU tar（读不了 zip）、
      # 也不保证有 unzip，所以走 pwsh 的 Expand-Archive。
      # 严格 ASCII-only —— 约束 (2)。Assert-Ok —— 约束 (1)。块内无 2>&1 —— 约束 (4)。
      # 不回读 cargo 输出做版本断言：版本已由下载 URL 唯一确定。
      - name: 安装 tauri-cli v2（官方预编译，替代源码编译）
        shell: pwsh
        run: |
          function Assert-Ok([string]$what) {
            if ($LASTEXITCODE -ne 0) {
              throw "GATE FAILED: $what exited with code $LASTEXITCODE"
            }
            Write-Host "gate ok: $what"
          }

          $asset = "cargo-tauri-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$($env:TAURI_CLI_VERSION)/$asset"
          $work = Join-Path $env:RUNNER_TEMP "tauri-cli"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $work $asset)
          Expand-Archive -Path (Join-Path $work $asset) -DestinationPath $work -Force

          $exe = Join-Path $work "cargo-tauri.exe"
          if (-not (Test-Path $exe)) {
            throw "prebuilt archive did not contain cargo-tauri.exe"
          }
          Copy-Item $exe (Join-Path $env:USERPROFILE ".cargo\bin\cargo-tauri.exe") -Force
          cargo tauri --version
          Assert-Ok "cargo tauri --version"

      # Windows 没有 musl cc，两个 Linux collector sidecar 只能靠 zig 自带的
      # musl sysroot 交叉编译。install-action 的 manifest 收录了 cargo-zigbuild 并带
      # SHA256 校验；刻意不钉版本，与原先 `cargo install --locked` 的取最新语义一致。
      - name: 安装 cargo-zigbuild（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # sidecar 归置约定（src-tauri/tauri.bundle.windows.json 已提交，本文件不改它）：
      #   externalBin: agentlens-askpass -> 源文件名须带 -<triple>.exe，装机时去后缀
      #   resources  : 两个 agentlens-collector-*-unknown-linux-musl + collectors.sha256
      # collector 刻意是 LINUX musl 二进制：AgentLens 管理的远端就是 Linux 主机。
      # 走 resources 而非 externalBin，因为后者会强行追加 .exe，
      # 而运行期按不带后缀的原名查找。
      #
      # 以下 run 块严格 ASCII-only —— 约束 (2)。Assert-Ok 是 windows.yml 的原样
      # 移植 —— 约束 (1)。块内没有 2>&1，也不设置 $ErrorActionPreference —— 约束 (4)(3)。
      - name: 归置 Windows sidecar（askpass + 双架构 musl collector）
        shell: pwsh
        run: |
          function Assert-Ok([string]$what) {
            if ($LASTEXITCODE -ne 0) {
              throw "GATE FAILED: $what exited with code $LASTEXITCODE"
            }
            Write-Host "gate ok: $what"
          }

          $stage = "target\dist\binaries"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          cargo build -p agentlens-askpass --release
          Assert-Ok "cargo build -p agentlens-askpass"
          Copy-Item "target\release\agentlens-askpass.exe" `
            "$stage\agentlens-askpass-x86_64-pc-windows-msvc.exe" -Force

          cargo zigbuild -p agentlens-collector --target x86_64-unknown-linux-musl --release
          Assert-Ok "cargo zigbuild x86_64-unknown-linux-musl"
          cargo zigbuild -p agentlens-collector --target aarch64-unknown-linux-musl --release
          Assert-Ok "cargo zigbuild aarch64-unknown-linux-musl"
          Copy-Item "target\x86_64-unknown-linux-musl\release\agentlens-collector" `
            "$stage\agentlens-collector-x86_64-unknown-linux-musl" -Force
          Copy-Item "target\aarch64-unknown-linux-musl\release\agentlens-collector" `
            "$stage\agentlens-collector-aarch64-unknown-linux-musl" -Force

          Push-Location $stage
          Get-ChildItem "agentlens-collector-*" | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii "collectors.sha256"
          Get-Content "collectors.sha256" | Write-Host
          Pop-Location

          foreach ($required in @(
            "agentlens-askpass-x86_64-pc-windows-msvc.exe",
            "agentlens-collector-x86_64-unknown-linux-musl",
            "agentlens-collector-aarch64-unknown-linux-musl",
            "collectors.sha256")) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "missing sidecar: $required"
            }
          }
          Get-ChildItem $stage | Format-List Name,Length | Out-String | Write-Host

      # 必须从仓库根运行：在 frontend/ 下 Tauri 会 panic
      # "Couldn't recognize the current folder as a Tauri project"。
      # 清单改名 sha256sums-windows.txt，避免与其他平台在同一 Release 上撞名。
      #
      # ---- Windows 出两种安装包，NSIS 是主推格式 ------------------------------
      # nsis → AgentLens_<version>_x64-setup.exe   scripts/install.ps1 默认装它
      # msi  → AgentLens_<version>_x64_en-US.msi   给企业 SCCM / 组策略，只能手工下载
      #
      # ★ 两者的升级语义不同，装了一个不会被另一个识别为同一应用 ★
      # MSI 按 ProductCode/UpgradeCode 判定升级链；NSIS 不用 upgradeCode，靠自己的
      # 注册表项，且默认 currentUser 装到 %LOCALAPPDATA%，而 MSI 是 per-machine。
      # 所以先装 NSIS 版的用户再装 MSI 版会得到**两份并存**的 AgentLens，反之亦然。
      # 这是 Windows 安装体系的既有行为，不是本仓库能消除的，只能保证同一格式内部的
      # 升级链是稳的。
      #
      # upgradeCode 已在 src-tauri/tauri.bundle.windows.json 里钉死（JSON 放不了注释，
      # 所以理由写在这里）。不写时 Tauri 按 productName 派生：
      #   Uuid::new_v5(NAMESPACE_DNS, "<productName>.exe.app.x64")
      # 即哪天改了 productName，upgradeCode 会跟着变，已装 MSI 的用户下次升级会变成
      # 装第二份。钉死的值 57809f90-bf2f-51e0-84e6-6d2c6f2aed0e 正是 productName
      # "AgentLens" 当前派生出的那一个，所以钉死本身不改变任何现有行为。
      #
      # ★ MSI 只能在 Windows 上产出（WiX 只跑在 Windows），所以 Makefile 的
      #   dist-windows（Linux + cargo-xwin 交叉编译）刻意只出 NSIS。★
      - name: 构建 NSIS + MSI 安装包并归置发布资产
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          function Assert-Ok([string]$what) {
            if ($LASTEXITCODE -ne 0) {
              throw "GATE FAILED: $what exited with code $LASTEXITCODE"
            }
            Write-Host "gate ok: $what"
          }

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for release builds"
          }
          cargo tauri build --bundles nsis,msi --config src-tauri/tauri.bundle.windows.json
          Assert-Ok "cargo tauri build --bundles nsis,msi"

          # 产物归集与校验清单都交给 scripts/ci/windows-collect-assets.ps1。
          # ★ 这里刻意不再用 `Get-ChildItem "*.exe"` 那种按后缀 glob 的写法 ★
          # 那种写法在新增一种安装包格式时会**静默漏掉**新产物的校验和：拷贝步骤加了
          # msi、清单步骤还只收 .exe，于是发出一个没有任何 digest 的资产，而 install.ps1
          # 正是靠这份清单校验下载的。构建、上传、门禁全都不会红。那个脚本改成从「已通过
          # 护栏的同一份列表」派生清单，并双向断言 2/2 格式，所以漏一个必然失败。
          pwsh -NoProfile -File scripts/ci/windows-collect-assets.ps1 `
            -BundleRoot "target\release\bundle" `
            -Destination "upload" `
            -ManifestName "sha256sums-windows.txt"
          Assert-Ok "scripts/ci/windows-collect-assets.ps1"

          $formats = @(
            [pscustomobject]@{ Dir = "nsis"; Pattern = "*-setup.exe" },
            [pscustomobject]@{ Dir = "msi"; Pattern = "*.msi" }
          )
          foreach ($format in $formats) {
            $assets = @(Get-ChildItem -File "target\release\bundle\$($format.Dir)\$($format.Pattern)")
            if ($assets.Count -ne 1) {
              throw "expected one signed asset in $($format.Dir), found $($assets.Count)"
            }
            $signature = "$($assets[0].FullName).sig"
            if (-not (Test-Path -LiteralPath $signature) -or (Get-Item $signature).Length -eq 0) {
              throw "missing or empty updater signature: $signature"
            }
            Copy-Item -LiteralPath $signature -Destination "upload\" -Force
          }

      - name: 上传资产到 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" upload/* --clobber

  # ---- 阶段 2c：macOS -----------------------------------------------------
  # 只做 aarch64-apple-darwin，不做 universal：macos-latest 是 Apple Silicon，
  # aarch64 是免费的原生构建；包进去的 sidecar 无论宿主架构都是 Linux musl 二进制。
  # 未签名 / 未公证：公证需要 Apple Developer 证书与 notarytool，本仓库没有这些
  # secret，刻意不加需要不存在的 secret 的步骤。
  macos-dmg:
    name: macOS dmg（未签名，aarch64）
    needs: [prepare, create-draft]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: 安装 Rust stable 与双 musl 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustc --version
          cargo --version

      # 纯只读地借用 ci.yml 存下的缓存：shared-key 必须与那边逐字相同（本 job 名与
      # gate 不同，不共用 shared-key 就永远命中不了），save-if: false 则保证发布链路
      # 一次都不写缓存 —— 发布是低频事件，写进去只会挤掉主干那三份热缓存。
      # 命不中也只是回到今天的全量编译，不影响正确性。
      - name: 只读复用 CI 的 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agentlens-gate
          cache-bin: "false"
          save-if: "false"

      # use-cache 关掉的理由见 ci.yml 同名步骤（cancelled run 会存下残缺的全局 zig 缓存）。
      - name: 安装 zig（musl 的 C 交叉编译器）
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: "false"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（npm ci，lockfile 权威）
        run: npm --prefix frontend ci

      # 资产名由 RUNNER_ARCH 推导：macOS 的 arm64 与 x64 资产都存在，GitHub 若换掉
      # macos-latest 的架构，这里会自动跟上而不是装错架构的二进制。
      - name: 安装 tauri-cli v2（官方预编译，替代源码编译）
        run: |
          case "$RUNNER_ARCH" in
            ARM64) asset=cargo-tauri-aarch64-apple-darwin.zip ;;
            X64)   asset=cargo-tauri-x86_64-apple-darwin.zip ;;
            *)
              echo "tauri-cli 没有 macOS-${RUNNER_ARCH} 的官方预编译资产"
              exit 1
              ;;
          esac
          work="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/$asset" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${asset}"
          unzip -q -j "$work/$asset" cargo-tauri -d "$work"
          install -m 0755 "$work/cargo-tauri" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version | tee "$work/version.txt"
          grep -qF "tauri-cli ${TAURI_CLI_VERSION}" "$work/version.txt" \
            || { echo "tauri-cli 实测版本与钉死的 ${TAURI_CLI_VERSION} 不符"; exit 1; }
          rm -rf "$work"

      - name: 安装 cargo-zigbuild（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: 回显版本号（单一事实源自检）
        run: make dist-version

      - name: 归置 macOS sidecar（askpass + 双架构 musl collector）
        run: |
          if [ ! -f "$MACOS_BUNDLE_CONFIG" ]; then
            echo "缺少 ${MACOS_BUNDLE_CONFIG}：macOS bundle overlay 未提交"
            exit 1
          fi
          cargo build -p agentlens-askpass --release --target "$MACOS_TARGET"
          mkdir -p target/dist/binaries
          cp "target/$MACOS_TARGET/release/agentlens-askpass" \
            "target/dist/binaries/agentlens-askpass-$MACOS_TARGET"
          cargo zigbuild -p agentlens-collector --target x86_64-unknown-linux-musl --release
          cargo zigbuild -p agentlens-collector --target aarch64-unknown-linux-musl --release
          cp target/x86_64-unknown-linux-musl/release/agentlens-collector \
            target/dist/binaries/agentlens-collector-x86_64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/agentlens-collector \
            target/dist/binaries/agentlens-collector-aarch64-unknown-linux-musl
          ( cd target/dist/binaries && shasum -a 256 agentlens-collector-* > collectors.sha256 && cat collectors.sha256 )
          chmod 0755 target/dist/binaries/*

      # env.CI 显式钉死 "true" —— 约束 (5)，与 macos.yml 一致。
      # .app / .dmg 没有 Apple codesign / notarization；updater 的 minisign 签名独立生成。
      # ls -R 是从日志确认 sidecar 真的进了 .app 的唯一手段。
      - name: 构建 .app / .dmg / updater archive 并归置发布资产
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" \
            || { echo '缺少 TAURI_SIGNING_PRIVATE_KEY，拒绝生成未签名发布包'; exit 1; }
          cargo tauri build --bundles app,dmg --target "$MACOS_TARGET" --config "$MACOS_BUNDLE_CONFIG"
          ls -R "target/$MACOS_TARGET/release/bundle/"
          mkdir -p upload
          cp "target/$MACOS_TARGET"/release/bundle/dmg/*.dmg upload/
          shopt -s nullglob
          updater_archives=("target/$MACOS_TARGET"/release/bundle/macos/*.app.tar.gz)
          test "${#updater_archives[@]}" -eq 1 \
            || { echo "macOS updater archive 数量应为 1，实际 ${#updater_archives[@]}"; exit 1; }
          test -s "${updater_archives[0]}.sig" || { echo 'macOS updater 签名缺失或为空'; exit 1; }
          cp "${updater_archives[0]}" "${updater_archives[0]}.sig" upload/
          ( cd upload && shasum -a 256 -- *.dmg > sha256sums-macos.txt && cat sha256sums-macos.txt )
          test -n "$(ls -A upload)" || { echo "upload/ 为空，拒绝上传"; exit 1; }
          ls -l upload/

      - name: 上传资产到 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" upload/* --clobber

  # ---- 阶段 3：publish ----------------------------------------------------
  # verify-ci 与三个平台**全部**成功才会运行（needs 是 AND 语义，任一失败或被跳过
  # 即不执行），所以 draft 只会在同 commit 的 CI 通过且产物齐全时被翻成正式 Release。
  publish:
    name: 三平台全绿后发布 Release
    needs:
      - prepare
      - create-draft
      - verify-ci
      - linux-deb
      - windows-nsis
      - macos-dmg
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # git-cliff 需要完整历史（含已有 tag）才能算出本次版本的提交区间。
          fetch-depth: 0

      # 用钉死版本的预编译包，避免 `cargo install git-cliff` 每次多花几分钟，
      # 也避免新版 git-cliff 改变模板渲染结果。
      - name: 安装 git-cliff（预编译，版本钉死）
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xzf - -C /tmp
          sudo install -m 0755 "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      # --strip all 去掉 header/footer，只留本次版本的分组条目，正好当 Release 正文。
      # 空正文视为失败：宁可停在 draft，也不发一个没有说明的 Release。
      #
      # 用 `--latest` 而非 `--unreleased --tag`：tag 在 create-draft 阶段就已建在
      # 本次发布提交上，`--latest` 因此正好取到它那一段。反过来用 --unreleased 会
      # 一条不剩（没有提交落在 tag 之外），只吐出一行标题 —— 本地实测 --latest 得
      # 29 行完整分组，--unreleased --tag 只有 25 字节的标题。
      - name: 用 git-cliff 生成 Release 正文
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          git-cliff --config cliff.toml --latest --strip all --output /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "git-cliff 产出空正文，拒绝发布 ${TAG_NAME}"
            exit 1
          fi
          cat /tmp/release-notes.md

      - name: 安装 minisign（验签 draft 中的 updater 资产）
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          command -v minisign

      # 从 draft Release 回读资产，而不是验构建目录：只有这样才能证明真正准备公开的
      # 字节与其 .sig 配对。四个平台全部验签后才生成 latest.json；随后先上传清单，
      # 再执行 --draft=false，任何缺件、空签名或签名不匹配都会让 Release 保持 draft。
      - name: 验签四平台 updater 资产并生成 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release view "$TAG_NAME" --json isDraft,assets > /tmp/release.json
          jq -r '.isDraft' /tmp/release.json | grep -qx 'true' \
            || { echo "${TAG_NAME} 不是 draft，拒绝在未知状态上继续"; exit 1; }
          jq -r '.assets[].name' /tmp/release.json | tee /tmp/assets.txt
          for pattern in '\.deb$' '\.exe$' '\.msi$' '\.dmg$' '\.app\.tar\.gz$' \
            '^sha256sums-linux\.txt$' '^sha256sums-windows\.txt$' '^sha256sums-macos\.txt$'
          do
            grep -qE "$pattern" /tmp/assets.txt \
              || { echo "draft 缺少匹配 ${pattern} 的资产"; exit 1; }
          done

          rm -rf /tmp/release-assets
          mkdir -p /tmp/release-assets
          gh release download "$TAG_NAME" --dir /tmp/release-assets

          pub_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/ci/generate-latest-json.mjs \
            --assets /tmp/release-assets \
            --version "$VERSION" \
            --tag "$TAG_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --notes /tmp/release-notes.md \
            --pub-date "$pub_date" \
            --output /tmp/release-assets/latest.json

          jq -er '.plugins.updater.pubkey' src-tauri/tauri.conf.json \
            | base64 --decode > /tmp/updater.pub
          test -s /tmp/updater.pub || { echo 'updater 公钥解码后为空'; exit 1; }

          shopt -s nullglob
          updater_assets=(
            /tmp/release-assets/*-setup.exe
            /tmp/release-assets/*.msi
            /tmp/release-assets/*.deb
            /tmp/release-assets/*.app.tar.gz
          )
          test "${#updater_assets[@]}" -eq 4 \
            || { echo "updater 资产数量应为 4，实际 ${#updater_assets[@]}"; exit 1; }
          for asset in "${updater_assets[@]}"; do
            signature="${asset}.sig"
            test -s "$signature" || { echo "缺少或为空：${signature}"; exit 1; }
            decoded="${signature}.minisig"
            base64 --decode "$signature" > "$decoded"
            minisign -Vm "$asset" -p /tmp/updater.pub -x "$decoded"
            rm -f "$decoded"
          done

          jq -e --arg version "$VERSION" '
            .version == $version and
            (.platforms | keys) == [
              "darwin-aarch64",
              "linux-x86_64-deb",
              "windows-x86_64-msi",
              "windows-x86_64-nsis"
            ] and
            all(.platforms[]; .signature != "")
          ' /tmp/release-assets/latest.json >/dev/null
          gh release upload "$TAG_NAME" /tmp/release-assets/latest.json --clobber

          gh release view "$TAG_NAME" --json isDraft,assets > /tmp/release-ready.json
          jq -r '.isDraft' /tmp/release-ready.json | grep -qx 'true' \
            || { echo '上传 latest.json 前 Release 已被公开'; exit 1; }
          jq -r '.assets[].name' /tmp/release-ready.json | grep -qx 'latest.json' \
            || { echo 'latest.json 未出现在 draft Release'; exit 1; }

      - name: 翻转 draft 为正式 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" \
            --notes-file /tmp/release-notes.md \
            --draft=false
          state="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
          if [ "$state" != "false" ]; then
            echo "发布失败：${TAG_NAME} 仍是 draft"
            exit 1
          fi
          echo "已发布 ${TAG_NAME}"

      # tag 是 publish 的副产物而非前提，所以必须显式验证它真的诞生了，并且指向
      # release-please 声明的那个提交 —— 否则 Release 页面看着正常，git tag 却缺失
      # 或指错，install.sh 按 tag 取产物就会全线失败。
      - name: 断言 tag 仍指向发布提交
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
          echo "refs/tags/${TAG_NAME} -> ${tag_sha}"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "tag 指向 ${tag_sha}，与发布提交 ${RELEASE_SHA} 不一致"
            exit 1
          fi

      # 收尾 release-please 的状态机：它自己不再建 Release（skip-github-release），
      # 所以 `autorelease: pending` 这个标签得由真正完成发布的一方翻成 tagged，
      # 否则那个已合并的发布 PR 会永远显示「待发布」。
      # 找不到 pending PR 不是错误：手动 workflow_dispatch 触发的发布本就没有 PR。
      - name: 把发布 PR 的 autorelease 标签翻成 tagged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          gh pr list --state merged --label 'autorelease: pending' \
            --limit 20 --json number --jq '.[].number' > /tmp/pending.txt
          if [ ! -s /tmp/pending.txt ]; then
            echo "没有 autorelease: pending 的已合并 PR，跳过标签收尾"
            exit 0
          fi
          while read -r num; do
            echo "PR #${num}: pending -> tagged"
            gh pr edit "$num" \
              --add-label 'autorelease: tagged' \
              --remove-label 'autorelease: pending'
          done < /tmp/pending.txt

  # ---- 旁路：release-please 只维护发布 PR ---------------------------------
  # 它不再创建 Release（release-please-config.json 的 skip-github-release: true），
  # 职责收窄为：累积变更、算下一个版本号、把版本写进 manifest / Cargo.toml /
  # frontend/package.json、生成 changelog/CHANGELOG-v0.md，并把这些放进一个长期
  # 存在的发布 PR。合并该 PR 会让 manifest 版本领先于已有 tag，prepare 因此在同一次
  # push 上判定 should_release=true —— 这就是本文件的发布触发方式。
  #
  # 发布 PR 就是集成点：它和普通 PR 一样跑 ci.yml 的全部门禁，失败时**往同一个
  # 分支再推修复提交**让 PR 自我修复，绝不另开 PR。
  #
  # squash-merge 陷阱：仓库若以 squash 合并，release-please 只看得到 squash
  # 提交的标题。标题写成 chore:/refactor: 的 PR 会把分支里的 feat:/fix: 折叠掉，
  # 于是**静默停止升版**。因此仓库 squash 策略必须设为 PR_TITLE，并由
  # .github/workflows/pr-title.yml 强制 PR 标题符合 Conventional Commits。
  #
  # 它与发布链路完全解耦：本 job 失败不影响已在进行的发布，反之亦然。
  release-please:
    name: release-please（只维护发布 PR）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # 全量回显 outputs。保留而非诊断完就删：release-please 判定失败时只写 warn
      # 到日志、不让 job 变红，唯一能证伪「输出键名/值」猜测的就是这份 JSON。
      - name: 全量回显 release-please 的 outputs（排障锚点）
        env:
          OUTPUTS_JSON: ${{ toJSON(steps.release.outputs) }}
        run: |
          printf '%s\n' "$OUTPUTS_JSON"
