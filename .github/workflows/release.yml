name: release

# ===========================================================================
# 发布流水线：release-please 驱动，draft-until-all-green。
#
# 形态：
#   push main ──▶ release-please  (维护发布 PR；PR 合并的那一次 push 才建 draft)
#                      │ releases_created == 'true'
#         ┌────────────┼────────────┬────────────┐
#         ▼            ▼            ▼            ▼
#      verify-ci   linux-deb   windows-nsis  macos-dmg   查询 CI 与构建并行
#         └────────────┴────────────┼────────────┘
#                                  ▼
#                        publish  ← CI + 三平台都绿才公开 Release（并由此产生 tag）
#
# ---- tag 由谁创建：本仓库权限下唯一可行的那条路 -------------------------
# GitHub 的 draft Release 是**未发布**状态，创建 draft 不会产生 git tag；tag 是
# 在 draft 被 publish 的那一刻，由 GitHub 按 Release 记录里的 target_commitish
# 自动创建的。release-please 的 createRelease 传的正是 `target_commitish:
# release.sha`（release-please src/github-api.ts），即发布 PR 的合并提交，
# 所以「先 draft、最后 publish」不会因为 main 往前走而把 tag 打到错误的提交上。
#
# 曾经这里配过 release-please 的 `force-tag-creation: true`，让它在建 draft 之前
# 先显式补一个 tag ref。那条路在本仓库走不通：
#   ✔ Creating 1 releases for pull #17
#   ##[error]release-please failed: Resource not accessible by integration
#             - https://docs.github.com/rest/git/refs#create-a-reference
# forceTag 分支调用的是 `octokit.git.createRef`，而默认 GITHUB_TOKEN 在本仓库
# 拿不到这个 endpoint（已逐项排除：Actions 默认权限 write、无分支保护、无 tag
# 保护、无 ruleset、个人 public 非 fork、job 已声明 contents: write）。它在
# createRelease **之前**执行，所以整个发布在这一步就断掉，连 draft 都没建出来。
#
# 因此删掉 force-tag-creation，改为不预先造 tag：draft 阶段全程无 tag，publish
# 翻牌时 tag 与公开 Release 同时诞生。副作用是本文件不能再用 tag 名做检出与
# CI 定位 —— 那些地方一律改用 release-please 输出的 `sha`（见各 job 的 ref）。
# 唯一仍按 tag 名寻址的是 gh release 三条命令：gh 的 FetchRelease 在
# `releases/tags/{tag}` 404 时会走 GraphQL 按 **pending tag name** 找 draft
# （cli/cli pkg/cmd/release/shared/fetch.go），tagless draft 也能命中。
#
# 为什么坚持 draft 而不学 pt-tools 直接建正式 Release：
#   pt-tools 由 release-please 直接建非 draft Release、产物随后追加。那样 Release
#   公开的瞬间资产还是空的，要等二十多分钟三平台才补齐 —— 这个窗口里用户会下载到
#   一个没有安装包的 Release。本项目的取舍相反：宁可晚发布，也不发一个残包。
#
# 产物不齐时会发生什么：draft 停在原地，不产生 tag、不产生公开 Release，
# 缺哪个平台从 Actions 页面一眼可见。修完用 `gh run rerun --failed` 重跑失败 job
# 即可 —— release-please job 已成功，它的 outputs 会被保留，不会二次建 Release
# （真要整轮重跑，release-please 会因 tag_name 已存在抛 DuplicateReleaseError，
# releases_created 不再为 true，这也是它防重复发布的设计）。
#
# 版本号：唯一事实源是根 Cargo.toml 的 [workspace.package].version，由
# release-please 通过显式 extra-files 写入（见 release-please-config.json），
# 本文件从不硬编码第二份版本，只回显 `make dist-version`。
#
# ---- 从 .github/workflows/ci.yml 原样承接的五条硬约束 --------------------
# (1) 每条 native 命令后跟 Assert-Ok：pwsh 里 native 命令非零退出**不会**中断
#     脚本，而 GitHub 注入的 $LASTEXITCODE 检查只反映**最后一条**命令。
# (2) 每个 `shell: pwsh` 的 run 块严格 ASCII-only：PS 5.1 按 ANSI 解析文件，
#     一个非 ASCII 字符就会撕裂字符串字面量，job 在 1s 内无错误文本地死掉。
#     step 名与 YAML 注释可以是中文 —— 它们不进 pwsh 解析器。
# (3) 绝不设置 $ErrorActionPreference：GitHub 会前置 Stop。
# (4) 绝不在 pwsh 里给 cargo 套 2>&1：叠加 (3) 的 Stop 后，cargo 往 stderr 打的
#     `Updating crates.io index` 这类普通噪声会变成终止性 NativeCommandError。
# (5) macOS 打 dmg 必须 CI == "true"：tauri-bundler 只有在 CI 为 true 时才给
#     hdiutil 传 --skip-jenkins，否则 osascript 在无头环境下以 64 退出。
#
# 另外：本文件任何构建/门禁步骤都没有 `|| true`，也没有 continue-on-error。
# 把失败洗成绿正是本项目已经修过一次的缺陷。
#
# 本仓库尚无 git remote，这份 workflow 从未在 GitHub Actions 上执行过 ——
# 它是 actionlint 干净的、未运行的。三平台构建步骤是 ci.yml 的原样承接，
# 而 ci.yml 本身翻译自 AWS CodeBuild 上跑绿的 .aws/buildspec/*.yml。
# ===========================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# 发布流程不允许被后一次 push 取消：中途取消会留下一个装了一半产物的 draft。
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # bash 在三个 runner 上都可用（Windows 走 Git bash），GitHub 以
    # `bash --noprofile --norc -eo pipefail {0}` 运行它 —— 非零退出即失败。
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "22"
  # 与 ci.yml 及三份 buildspec 同一枚举：0.14.0 是实测跑绿的那个。
  ZIG_VERSION: "0.14.0"
  # 必须与 ci.yml 的 TAURI_CLI_VERSION 逐字一致：发布产物与门禁产物要出自同一个
  # bundler。装的是官方预编译二进制，URL 含版本号，所以只能钉死具体版本。
  TAURI_CLI_VERSION: "2.11.4"
  MACOS_TARGET: aarch64-apple-darwin
  MACOS_BUNDLE_CONFIG: src-tauri/tauri.bundle.macos.json
  # git-cliff 只用来生成 Release 正文，钉死版本避免新版改模板渲染。
  GIT_CLIFF_VERSION: "2.13.1"
  # 约束 (5)：显式钉住，不依赖 runner 默认值。
  CI: "true"

jobs:
  # ---- 阶段 1：release-please ---------------------------------------------
  # 平时它只维护那个长期存在的发布 PR（累积变更 + 预演版本号与变更日志）。
  # 只有该 PR 被合并进 main 的那一次 push，才会 releases_created == 'true'，
  # 同时打出 tag 并建出 draft Release。
  #
  # 发布 PR 就是集成点：它和普通 PR 一样跑 ci.yml 的全部门禁，失败时**往同一个
  # 分支再推修复提交**让 PR 自我修复，绝不另开 PR。
  #
  # squash-merge 陷阱：仓库若以 squash 合并，release-please 只看得到 squash
  # 提交的标题。标题写成 chore:/refactor: 的 PR 会把分支里的 feat:/fix: 折叠掉，
  # 于是**静默停止升版**。因此仓库 squash 策略必须设为 PR_TITLE，并由
  # .github/workflows/pr-title.yml 强制 PR 标题符合 Conventional Commits。
  release-please:
    name: release-please（维护发布 PR、建 draft Release）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      # 键名不是猜的：action 的 outputReleases() 里，`releases_created` 是无论
      # 几个包都会 setOutput 的顶层布尔；其余键经 setPathOutput(path,…) 输出，
      # 本仓库 packages 只有 "."，而 path === '.' 时该函数**不加前缀**，所以
      # tag_name / sha 都是裸键（release-please-action src/index.ts）。
      # pt-tools 用的 `release_created` 是同一处为 path 设的单数别名，二者同时存在。
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # draft 阶段没有 tag，下游 checkout 与 CI 定位只能靠这个 sha。
      # 它等于发布 PR 的合并提交，也是 Release 记录的 target_commitish。
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # 全量回显 action 的 outputs。保留而非诊断完就删：release-please 判定失败时
      # 只写 warn 到日志、不让 job 变红，唯一能证伪「输出键名/值」猜测的就是这份
      # JSON。曾有三轮发布因为凭空猜测键名被前缀化而白跑，这一步的成本是 0.1s。
      - name: 全量回显 release-please 的 outputs（排障锚点）
        env:
          OUTPUTS_JSON: ${{ toJSON(steps.release.outputs) }}
        run: |
          printf '%s\n' "$OUTPUTS_JSON"

      - name: 回显本次判定（是否切出了新版本）
        env:
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IS_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          echo "releases_created = ${RELEASES_CREATED:-false}"
          echo "release_created  = ${RELEASE_CREATED:-false}"
          echo "tag_name         = ${TAG_NAME:-<none>}"
          echo "sha              = ${RELEASE_SHA:-<none>}"
          echo "draft            = ${IS_DRAFT:-<none>}"

  # ---- 阶段 2：查询发布提交对应的 CI 结论 ---------------------------------
  # 这里只读 Actions API，不重复 cargo/npm。它与三个构建 job 并行；唯一会把 draft
  # 公开的 publish 同时 needs 本 job 和三个构建，因此 CI 不成功时绝无公开 Release。
  # 定位对象是 release-please 输出的 sha（发布 PR 的合并提交），不是 tag ——
  # 此刻 tag 还不存在，任何 `commits/{tag}` 解析都会 404。
  verify-ci:
    name: 确认发布提交的 CI Success
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      actions: read
      contents: read
    steps:
      - name: 轮询同一 commit 的 CI Success（超时或非 success 即失败）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag_sha="${RELEASE_SHA}"
          test -n "$tag_sha" || { echo "release-please 未输出 sha，无法定位 CI run"; exit 1; }
          echo "待发布 ${TAG_NAME} -> ${tag_sha}"

          run_id=''
          for attempt in $(seq 1 120); do
            if [ -z "$run_id" ]; then
              run_id="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${DEFAULT_BRANCH}&event=push&per_page=100" \
                --jq ".workflow_runs | map(select(.head_sha == \"${tag_sha}\")) | sort_by(.run_attempt) | last | .id // empty")"
              if [ -n "$run_id" ]; then
                echo "找到 CI run ${run_id}（commit ${tag_sha}）"
              fi
            fi

            if [ -n "$run_id" ]; then
              job_state="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
                --jq '(.jobs | map(select(.name == "CI Success")) | last // empty) | "\(.status)|\(.conclusion // "")"')"
              status="${job_state%%|*}"
              conclusion="${job_state#*|}"

              if [ "$status" = 'completed' ]; then
                if [ "$conclusion" = 'success' ]; then
                  echo "CI Success 已通过（run ${run_id}，commit ${tag_sha}）"
                  exit 0
                fi
                echo "CI Success 结论为 ${conclusion:-<empty>}，拒绝公开 Release"
                exit 1
              fi

              case "$status" in
                ''|queued|in_progress|waiting|pending|requested)
                  echo "等待 CI Success：attempt=${attempt}/120 status=${status:-not-created}"
                  ;;
                *)
                  echo "CI Success 返回未知状态 ${status}，fail-closed"
                  exit 1
                  ;;
              esac
            else
              echo "等待 commit ${tag_sha} 的 CI push run：attempt=${attempt}/120"
            fi

            if [ "$attempt" -lt 120 ]; then
              sleep 60
            fi
          done

          echo "等待 CI Success 超时，拒绝公开 Release"
          exit 1

  # ---- 阶段 2a：Linux ------------------------------------------------------
  # 步骤与 ci.yml 的 Linux 分支逐条对应。dist-all == dist + 「aarch64 collector
  # 必须存在」的硬要求：本 job 是 aarch64 产物的权威构建点，缺席即失败，
  # 绝不静默产出单架构包。
  linux-deb:
    name: Linux deb + 双架构 musl collector
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # 钉 sha 而不是 tag：此刻 tag 尚未创建（publish 翻牌时才由 GitHub 建），
          # 用 tag 名会直接检出失败。sha 是发布 PR 的合并提交，即 Cargo.toml 被
          # release-please 写成目标版本的那一次提交，也不会随 main 前进而漂移。
          ref: ${{ needs.release-please.outputs.sha }}

      # 与 ci.yml / linux.yml 同一份包名清单。
      # libayatana-appindicator3-dev 必须有：src-tauri 打开了 tray-icon feature。
      # musl-tools 提供 musl-gcc（x86_64 collector 的 C 编译器）。
      - name: 安装 Tauri 2 系统依赖与 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev \
            musl-tools \
            curl file

      - name: 安装 Rust stable 与双 musl 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustc --version
          cargo --version

      # 纯只读地借用 ci.yml 存下的缓存：shared-key 必须与那边逐字相同（本 job 名与
      # gate 不同，不共用 shared-key 就永远命中不了），save-if: false 则保证发布链路
      # 一次都不写缓存 —— 发布是低频事件，写进去只会挤掉主干那三份热缓存。
      # 命不中也只是回到今天的全量编译，不影响正确性。
      - name: 只读复用 CI 的 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agentlens-gate
          cache-bin: "false"
          save-if: "false"

      # zig 只作为 musl 的 C 交叉编译器（rusqlite 的 bundled feature 要编 sqlite3.c）。
      - name: 安装 zig（aarch64/x86_64 musl 的 C 交叉编译器）
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（npm ci，lockfile 权威）
        run: npm --prefix frontend ci

      # 官方 release 的 cargo-tauri 二进制落进 ~/.cargo/bin，`cargo tauri build` 的调用
      # 方式与原先完全一致（Makefile 的 dist-bundle 直接依赖它）。解包后是扁平的四个
      # 文件（LICENSE x2 + README + 二进制），只取那个二进制。
      - name: 安装 tauri-cli v2（官方预编译，替代源码编译）
        run: |
          asset=cargo-tauri-x86_64-unknown-linux-gnu.tgz
          test "$RUNNER_ARCH" = 'X64' \
            || { echo "tauri-cli 没有 Linux-${RUNNER_ARCH} 的官方预编译资产"; exit 1; }
          work="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/$asset" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${asset}"
          tar xzf "$work/$asset" -C "$work" cargo-tauri
          install -m 0755 "$work/cargo-tauri" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version | tee "$work/version.txt"
          grep -qF "tauri-cli ${TAURI_CLI_VERSION}" "$work/version.txt" \
            || { echo "tauri-cli 实测版本与钉死的 ${TAURI_CLI_VERSION} 不符"; exit 1; }
          rm -rf "$work"

      - name: 回显版本号（单一事实源自检）
        run: make dist-version

      - name: 打包 deb + 双架构 musl collector（aarch64 缺席即失败）
        env:
          DIST_REQUIRE_AARCH64: "1"
        run: make dist-all

      - name: 校验 deb 载荷含 askpass 与双架构 collector
        run: |
          ls -l artifacts/dist/
          cat artifacts/dist/sha256sums.txt
          deb="$(ls -1 artifacts/dist/*.deb)"
          dpkg --contents "$deb" | tee /tmp/deb-contents.txt
          for expected in \
            usr/bin/agentlens-askpass \
            usr/bin/agentlens-collector-x86_64-unknown-linux-musl \
            usr/bin/agentlens-collector-aarch64-unknown-linux-musl
          do
            grep -q "$expected" /tmp/deb-contents.txt \
              || { echo "deb 缺少 ${expected}"; exit 1; }
          done

      # 三个平台都会产出名为 sha256sums.txt 的清单：直接上传会在同一个 Release 上
      # 撞名互相覆盖。改名后按平台隔离。两个 musl collector 只从本 job 上传
      # （它是 aarch64 的权威构建点），其余平台不重复上传同名二进制。
      - name: 归置发布资产（按平台隔离清单名）
        run: |
          mkdir -p upload
          cp artifacts/dist/*.deb upload/
          cp artifacts/dist/agentlens-collector-x86_64-unknown-linux-musl upload/
          cp artifacts/dist/agentlens-collector-aarch64-unknown-linux-musl upload/
          cp artifacts/dist/sha256sums.txt upload/sha256sums-linux.txt
          test -n "$(ls -A upload)" || { echo "upload/ 为空，拒绝上传"; exit 1; }
          ls -l upload/

      - name: 上传资产到 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" upload/* --clobber

  # ---- 阶段 2b：Windows ---------------------------------------------------
  windows-nsis:
    name: Windows NSIS 安装包
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      # 必须在 checkout 之前：autocrlf 一旦生效工作区就被写成 CRLF；
      # core.longpaths 是 windows.yml 缺陷 (E) 的原样移植
      # （Tauri/MSVC 输出路径会超过 MAX_PATH）。
      - name: 固定行尾与长路径（必须在 checkout 之前）
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: 安装 Rust stable 与双 musl 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustc --version
          cargo --version

      # 纯只读地借用 ci.yml 存下的缓存：shared-key 必须与那边逐字相同（本 job 名与
      # gate 不同，不共用 shared-key 就永远命中不了），save-if: false 则保证发布链路
      # 一次都不写缓存 —— 发布是低频事件，写进去只会挤掉主干那三份热缓存。
      # 命不中也只是回到今天的全量编译，不影响正确性。
      - name: 只读复用 CI 的 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agentlens-gate
          cache-bin: "false"
          save-if: "false"

      - name: 安装 zig（musl 的 C 交叉编译器）
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（npm ci，lockfile 权威）
        run: npm --prefix frontend ci

      # 与 ci.yml 的 Windows 分支逐条对应：Git bash 的 tar 是 GNU tar（读不了 zip）、
      # 也不保证有 unzip，所以走 pwsh 的 Expand-Archive。
      # 严格 ASCII-only —— 约束 (2)。Assert-Ok —— 约束 (1)。块内无 2>&1 —— 约束 (4)。
      # 不回读 cargo 输出做版本断言：版本已由下载 URL 唯一确定。
      - name: 安装 tauri-cli v2（官方预编译，替代源码编译）
        shell: pwsh
        run: |
          function Assert-Ok([string]$what) {
            if ($LASTEXITCODE -ne 0) {
              throw "GATE FAILED: $what exited with code $LASTEXITCODE"
            }
            Write-Host "gate ok: $what"
          }

          $asset = "cargo-tauri-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$($env:TAURI_CLI_VERSION)/$asset"
          $work = Join-Path $env:RUNNER_TEMP "tauri-cli"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $work $asset)
          Expand-Archive -Path (Join-Path $work $asset) -DestinationPath $work -Force

          $exe = Join-Path $work "cargo-tauri.exe"
          if (-not (Test-Path $exe)) {
            throw "prebuilt archive did not contain cargo-tauri.exe"
          }
          Copy-Item $exe (Join-Path $env:USERPROFILE ".cargo\bin\cargo-tauri.exe") -Force
          cargo tauri --version
          Assert-Ok "cargo tauri --version"

      # Windows 没有 musl cc，两个 Linux collector sidecar 只能靠 zig 自带的
      # musl sysroot 交叉编译。install-action 的 manifest 收录了 cargo-zigbuild 并带
      # SHA256 校验；刻意不钉版本，与原先 `cargo install --locked` 的取最新语义一致。
      - name: 安装 cargo-zigbuild（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # sidecar 归置约定（src-tauri/tauri.bundle.windows.json 已提交，本文件不改它）：
      #   externalBin: agentlens-askpass -> 源文件名须带 -<triple>.exe，装机时去后缀
      #   resources  : 两个 agentlens-collector-*-unknown-linux-musl + collectors.sha256
      # collector 刻意是 LINUX musl 二进制：AgentLens 管理的远端就是 Linux 主机。
      # 走 resources 而非 externalBin，因为后者会强行追加 .exe，
      # 而运行期按不带后缀的原名查找。
      #
      # 以下 run 块严格 ASCII-only —— 约束 (2)。Assert-Ok 是 windows.yml 的原样
      # 移植 —— 约束 (1)。块内没有 2>&1，也不设置 $ErrorActionPreference —— 约束 (4)(3)。
      - name: 归置 Windows sidecar（askpass + 双架构 musl collector）
        shell: pwsh
        run: |
          function Assert-Ok([string]$what) {
            if ($LASTEXITCODE -ne 0) {
              throw "GATE FAILED: $what exited with code $LASTEXITCODE"
            }
            Write-Host "gate ok: $what"
          }

          $stage = "target\dist\binaries"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          cargo build -p agentlens-askpass --release
          Assert-Ok "cargo build -p agentlens-askpass"
          Copy-Item "target\release\agentlens-askpass.exe" `
            "$stage\agentlens-askpass-x86_64-pc-windows-msvc.exe" -Force

          cargo zigbuild -p agentlens-collector --target x86_64-unknown-linux-musl --release
          Assert-Ok "cargo zigbuild x86_64-unknown-linux-musl"
          cargo zigbuild -p agentlens-collector --target aarch64-unknown-linux-musl --release
          Assert-Ok "cargo zigbuild aarch64-unknown-linux-musl"
          Copy-Item "target\x86_64-unknown-linux-musl\release\agentlens-collector" `
            "$stage\agentlens-collector-x86_64-unknown-linux-musl" -Force
          Copy-Item "target\aarch64-unknown-linux-musl\release\agentlens-collector" `
            "$stage\agentlens-collector-aarch64-unknown-linux-musl" -Force

          Push-Location $stage
          Get-ChildItem "agentlens-collector-*" | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii "collectors.sha256"
          Get-Content "collectors.sha256" | Write-Host
          Pop-Location

          foreach ($required in @(
            "agentlens-askpass-x86_64-pc-windows-msvc.exe",
            "agentlens-collector-x86_64-unknown-linux-musl",
            "agentlens-collector-aarch64-unknown-linux-musl",
            "collectors.sha256")) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "missing sidecar: $required"
            }
          }
          Get-ChildItem $stage | Format-List Name,Length | Out-String | Write-Host

      # 必须从仓库根运行：在 frontend/ 下 Tauri 会 panic
      # "Couldn't recognize the current folder as a Tauri project"。
      # 清单改名 sha256sums-windows.txt，避免与其他平台在同一 Release 上撞名。
      - name: 构建 NSIS 安装包并归置发布资产
        shell: pwsh
        run: |
          function Assert-Ok([string]$what) {
            if ($LASTEXITCODE -ne 0) {
              throw "GATE FAILED: $what exited with code $LASTEXITCODE"
            }
            Write-Host "gate ok: $what"
          }

          cargo tauri build --bundles nsis --config src-tauri/tauri.bundle.windows.json
          Assert-Ok "cargo tauri build --bundles nsis"

          $nsis = Get-ChildItem "target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue
          if (-not $nsis) {
            throw "NSIS installer not produced under target\release\bundle\nsis"
          }
          New-Item -ItemType Directory -Force -Path "upload" | Out-Null
          Copy-Item $nsis.FullName "upload\" -Force

          Push-Location "upload"
          Get-ChildItem "*.exe" | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii "sha256sums-windows.txt"
          Get-Content "sha256sums-windows.txt" | Write-Host
          Pop-Location

          if (-not (Get-ChildItem "upload")) {
            throw "upload directory is empty, refusing to upload"
          }
          Get-ChildItem "upload" | Format-List Name,Length | Out-String | Write-Host

      - name: 上传资产到 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" upload/* --clobber

  # ---- 阶段 2c：macOS -----------------------------------------------------
  # 只做 aarch64-apple-darwin，不做 universal：macos-latest 是 Apple Silicon，
  # aarch64 是免费的原生构建；包进去的 sidecar 无论宿主架构都是 Linux musl 二进制。
  # 未签名 / 未公证：公证需要 Apple Developer 证书与 notarytool，本仓库没有这些
  # secret，刻意不加需要不存在的 secret 的步骤。
  macos-dmg:
    name: macOS dmg（未签名，aarch64）
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: 安装 Rust stable 与双 musl 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustc --version
          cargo --version

      # 纯只读地借用 ci.yml 存下的缓存：shared-key 必须与那边逐字相同（本 job 名与
      # gate 不同，不共用 shared-key 就永远命中不了），save-if: false 则保证发布链路
      # 一次都不写缓存 —— 发布是低频事件，写进去只会挤掉主干那三份热缓存。
      # 命不中也只是回到今天的全量编译，不影响正确性。
      - name: 只读复用 CI 的 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agentlens-gate
          cache-bin: "false"
          save-if: "false"

      - name: 安装 zig（musl 的 C 交叉编译器）
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（npm ci，lockfile 权威）
        run: npm --prefix frontend ci

      # 资产名由 RUNNER_ARCH 推导：macOS 的 arm64 与 x64 资产都存在，GitHub 若换掉
      # macos-latest 的架构，这里会自动跟上而不是装错架构的二进制。
      - name: 安装 tauri-cli v2（官方预编译，替代源码编译）
        run: |
          case "$RUNNER_ARCH" in
            ARM64) asset=cargo-tauri-aarch64-apple-darwin.zip ;;
            X64)   asset=cargo-tauri-x86_64-apple-darwin.zip ;;
            *)
              echo "tauri-cli 没有 macOS-${RUNNER_ARCH} 的官方预编译资产"
              exit 1
              ;;
          esac
          work="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/$asset" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${asset}"
          unzip -q -j "$work/$asset" cargo-tauri -d "$work"
          install -m 0755 "$work/cargo-tauri" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version | tee "$work/version.txt"
          grep -qF "tauri-cli ${TAURI_CLI_VERSION}" "$work/version.txt" \
            || { echo "tauri-cli 实测版本与钉死的 ${TAURI_CLI_VERSION} 不符"; exit 1; }
          rm -rf "$work"

      - name: 安装 cargo-zigbuild（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: 回显版本号（单一事实源自检）
        run: make dist-version

      - name: 归置 macOS sidecar（askpass + 双架构 musl collector）
        run: |
          if [ ! -f "$MACOS_BUNDLE_CONFIG" ]; then
            echo "缺少 ${MACOS_BUNDLE_CONFIG}：macOS bundle overlay 未提交"
            exit 1
          fi
          cargo build -p agentlens-askpass --release --target "$MACOS_TARGET"
          mkdir -p target/dist/binaries
          cp "target/$MACOS_TARGET/release/agentlens-askpass" \
            "target/dist/binaries/agentlens-askpass-$MACOS_TARGET"
          cargo zigbuild -p agentlens-collector --target x86_64-unknown-linux-musl --release
          cargo zigbuild -p agentlens-collector --target aarch64-unknown-linux-musl --release
          cp target/x86_64-unknown-linux-musl/release/agentlens-collector \
            target/dist/binaries/agentlens-collector-x86_64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/agentlens-collector \
            target/dist/binaries/agentlens-collector-aarch64-unknown-linux-musl
          ( cd target/dist/binaries && shasum -a 256 agentlens-collector-* > collectors.sha256 && cat collectors.sha256 )
          chmod 0755 target/dist/binaries/*

      # env.CI 显式钉死 "true" —— 约束 (5)，与 macos.yml 一致。
      # ls -R 是从日志确认 sidecar 真的进了 .app 的唯一手段。
      - name: 构建 .app / .dmg 并归置发布资产
        env:
          CI: "true"
        run: |
          cargo tauri build --bundles app,dmg --target "$MACOS_TARGET" --config "$MACOS_BUNDLE_CONFIG"
          ls -R "target/$MACOS_TARGET/release/bundle/"
          mkdir -p upload
          cp "target/$MACOS_TARGET"/release/bundle/dmg/*.dmg upload/
          ( cd upload && shasum -a 256 -- *.dmg > sha256sums-macos.txt && cat sha256sums-macos.txt )
          test -n "$(ls -A upload)" || { echo "upload/ 为空，拒绝上传"; exit 1; }
          ls -l upload/

      - name: 上传资产到 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" upload/* --clobber

  # ---- 阶段 3：publish ----------------------------------------------------
  # verify-ci 与三个平台**全部**成功才会运行（needs 是 AND 语义，任一失败或被跳过
  # 即不执行），所以 draft 只会在同 commit 的 CI 通过且产物齐全时被翻成正式 Release。
  publish:
    name: 三平台全绿后发布 Release
    needs:
      - release-please
      - verify-ci
      - linux-deb
      - windows-nsis
      - macos-dmg
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          # git-cliff 需要完整历史（含已有 tag）才能算出本次版本的提交区间。
          fetch-depth: 0

      # 用钉死版本的预编译包，避免 `cargo install git-cliff` 每次多花几分钟，
      # 也避免新版 git-cliff 改变模板渲染结果。
      - name: 安装 git-cliff（预编译，版本钉死）
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xzf - -C /tmp
          sudo install -m 0755 "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      # --strip all 去掉 header/footer，只留本次版本的分组条目，正好当 Release 正文。
      # 空正文视为失败：宁可停在 draft，也不发一个没有说明的 Release。
      #
      # 用 `--unreleased --tag` 而非 `--latest`：此刻 tag 还没创建，--latest 找不到
      # 任何 tag 会退化成 unreleased 并把标题渲染成 `## [unreleased]`（本地对本仓库
      # 实测：两种写法正文逐字节相同，只有标题行差别）。--unreleased 取「不属于任何
      # tag 的提交」= 上一个 tag 到 HEAD，HEAD 已被上面钉在发布提交上，所以区间正确；
      # --tag 把这一段标注成即将发布的版本号，标题才是 `## [0.0.1]`。
      - name: 用 git-cliff 生成 Release 正文
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git-cliff --config cliff.toml --unreleased --tag "$TAG_NAME" \
            --strip all --output /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "git-cliff 产出空正文，拒绝发布 ${TAG_NAME}"
            exit 1
          fi
          cat /tmp/release-notes.md

      # 发布前复核 draft 上的资产：三个 job 各自都断言过 upload/ 非空，这里再从
      # Release 侧确认一次，防止上传步骤成功但资产实际没落到这个 Release 上。
      # 顺带断言它此刻仍是 draft：若已是公开状态，说明有人绕过流水线手工发过，
      # 与其在残缺状态上继续，不如停下。
      - name: 复核 draft 资产齐全（deb / setup.exe / dmg）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" --json isDraft,assets > /tmp/release.json
          jq -r '.isDraft' /tmp/release.json | grep -qx 'true' \
            || { echo "${TAG_NAME} 不是 draft，拒绝在未知状态上继续"; exit 1; }
          jq -r '.assets[].name' /tmp/release.json | tee /tmp/assets.txt
          for pattern in '\.deb$' '\.exe$' '\.dmg$' \
            '^sha256sums-linux\.txt$' '^sha256sums-windows\.txt$' '^sha256sums-macos\.txt$'
          do
            grep -qE "$pattern" /tmp/assets.txt \
              || { echo "draft 缺少匹配 ${pattern} 的资产"; exit 1; }
          done

      - name: 翻转 draft 为正式 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" \
            --notes-file /tmp/release-notes.md \
            --draft=false
          state="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
          if [ "$state" != "false" ]; then
            echo "发布失败：${TAG_NAME} 仍是 draft"
            exit 1
          fi
          echo "已发布 ${TAG_NAME}"

      # tag 是 publish 的副产物而非前提，所以必须显式验证它真的诞生了，并且指向
      # release-please 声明的那个提交 —— 否则 Release 页面看着正常，git tag 却缺失
      # 或指错，install.sh 按 tag 取产物就会全线失败。
      - name: 断言 tag 已由 GitHub 创建且指向发布提交
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
          echo "refs/tags/${TAG_NAME} -> ${tag_sha}"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "tag 指向 ${tag_sha}，与发布提交 ${RELEASE_SHA} 不一致"
            exit 1
          fi
