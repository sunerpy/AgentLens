name: tmp-diag-token

# 临时排障 workflow：验证默认 GITHUB_TOKEN 在本仓库能否创建 Release。
# 拿到结论后立即删除，不参与任何门禁。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 逐个 payload 变体探测 POST /releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: 969e303e754baf1c1d18c517fd4dee5ac4e47cef
        run: |
          try() {
            label="$1"; payload="$2"
            code="$(curl -sS -D /tmp/hdr.txt -o /tmp/body.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$payload")"
            echo "=== ${label} -> HTTP ${code}"
            cat /tmp/body.json
            echo
            grep -i 'x-accepted-github-permissions' /tmp/hdr.txt || echo "(无 x-accepted header)"
            if [ "$code" = "201" ]; then
              id="$(jq -r '.id' /tmp/body.json)"
              curl -sS -o /dev/null -X DELETE \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}"
              echo "cleaned ${id}"
            fi
          }

          try "B draft + target_commitish=陈旧 SHA 969e303（已知 403）" \
            "{\"tag_name\":\"tmp-diag-b\",\"draft\":true,\"name\":\"diag-b\",\"target_commitish\":\"${RELEASE_SHA}\"}"
          try "F draft + target_commitish=当前 main tip 的 SHA" \
            "{\"tag_name\":\"tmp-diag-f\",\"draft\":true,\"name\":\"diag-f\",\"target_commitish\":\"${GITHUB_SHA}\"}"
          try "G 非 draft + target_commitish=当前 main tip 的 SHA（真建 tag）" \
            "{\"tag_name\":\"tmp-diag-g\",\"draft\":false,\"name\":\"diag-g\",\"target_commitish\":\"${GITHUB_SHA}\"}"

      - name: 直接试 createRef（建 tag ref）并抓 header
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: 969e303e754baf1c1d18c517fd4dee5ac4e47cef
        run: |
          code="$(curl -sS -D /tmp/h.txt -o /tmp/body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"refs/tags/tmp-diag-ref\",\"sha\":\"${RELEASE_SHA}\"}")"
          echo "createRef -> HTTP ${code}"
          cat /tmp/body.json
          grep -i 'x-accepted-github-permissions' /tmp/h.txt || echo "(无 x-accepted-github-permissions)"
          if [ "$code" = "201" ]; then
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/tmp-diag-ref"
            echo "cleaned ref"
          fi

      - name: 回显 token 可见的 installation 权限
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -D /tmp/h.txt -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}"
          grep -i -E 'x-accepted-github-permissions|x-oauth-scopes|x-github-request-id' /tmp/h.txt || true
