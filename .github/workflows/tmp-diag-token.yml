name: tmp-diag-token

# 临时排障 workflow：验证默认 GITHUB_TOKEN 在本仓库能否创建 Release。
# 拿到结论后立即删除，不参与任何门禁。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 逐个 payload 变体探测 POST /releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: 969e303e754baf1c1d18c517fd4dee5ac4e47cef
        run: |
          try() {
            label="$1"; payload="$2"
            code="$(curl -sS -o /tmp/body.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$payload")"
            echo "=== ${label} -> HTTP ${code}"
            cat /tmp/body.json
            echo
            if [ "$code" = "201" ]; then
              id="$(jq -r '.id' /tmp/body.json)"
              curl -sS -o /dev/null -X DELETE \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}"
              echo "cleaned ${id}"
            fi
          }

          try "A 裸 draft（已知 201）" \
            '{"tag_name":"tmp-diag-a","draft":true,"name":"diag-a"}'
          try "B draft + target_commitish=发布提交" \
            "{\"tag_name\":\"tmp-diag-b\",\"draft\":true,\"name\":\"diag-b\",\"target_commitish\":\"${RELEASE_SHA}\"}"
          try "C release-please 的完整 payload（tag=v0.0.1）" \
            "{\"tag_name\":\"v0.0.1\",\"draft\":true,\"prerelease\":false,\"name\":\"v0.0.1\",\"body\":\"diag\",\"target_commitish\":\"${RELEASE_SHA}\"}"

      - name: 回显 token 可见的 installation 权限
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -D /tmp/h.txt -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}"
          grep -i -E 'x-accepted-github-permissions|x-oauth-scopes|x-github-request-id' /tmp/h.txt || true
