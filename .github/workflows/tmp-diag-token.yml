name: tmp-diag-token

# 临时排障 workflow：验证默认 GITHUB_TOKEN 在本仓库能否创建 Release。
# 拿到结论后立即删除，不参与任何门禁。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: POST /releases（draft，打印完整响应体与状态码）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          code="$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d '{"tag_name":"tmp-diag-do-not-use","draft":true,"name":"diag"}')"
          set +x
          echo "HTTP ${code}"
          cat /tmp/body.json
          if [ "$code" = "201" ]; then
            id="$(jq -r '.id' /tmp/body.json)"
            curl -sS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}"
            echo "已清理 diag release ${id}"
          fi

      - name: 回显 token 可见的 installation 权限
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -D /tmp/h.txt -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}"
          grep -i -E 'x-accepted-github-permissions|x-oauth-scopes|x-github-request-id' /tmp/h.txt || true
