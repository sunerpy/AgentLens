name: tmp-diag-token

# 临时排障 workflow：验证默认 GITHUB_TOKEN 在本仓库能否创建 Release。
# 拿到结论后立即删除，不参与任何门禁。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 逐个 payload 变体探测 POST /releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: 969e303e754baf1c1d18c517fd4dee5ac4e47cef
        run: |
          try() {
            label="$1"; payload="$2"
            code="$(curl -sS -D /tmp/hdr.txt -o /tmp/body.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$payload")"
            echo "=== ${label} -> HTTP ${code}"
            cat /tmp/body.json
            echo
            grep -i 'x-accepted-github-permissions' /tmp/hdr.txt || echo "(无 x-accepted header)"
            if [ "$code" = "201" ]; then
              id="$(jq -r '.id' /tmp/body.json)"
              curl -sS -o /dev/null -X DELETE \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}"
              echo "cleaned ${id}"
            fi
          }

          echo "（本轮跳过 B/F/G，已定论：陈旧 SHA 403、tip SHA 201）"

      - name: H createRef 在 tip SHA / I 真 tag 的 draft 能否 publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== H createRef refs/tags/tmp-diag-h @ tip ${GITHUB_SHA}"
          h="$(curl -sS -D /tmp/h.txt -o /tmp/hb.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"refs/tags/tmp-diag-h\",\"sha\":\"${GITHUB_SHA}\"}")"
          echo "createRef@tip -> HTTP ${h}"
          cat /tmp/hb.json
          grep -i 'x-accepted-github-permissions' /tmp/h.txt || true

          if [ "$h" = "201" ]; then
            echo "=== I 为已存在的 tag 建 draft，再 publish"
            gh release create tmp-diag-h --draft --title diag-h --notes diag >/dev/null
            gh release view tmp-diag-h --json isDraft,tagName --jq '"draft=\(.isDraft) tag=\(.tagName)"'
            gh release edit tmp-diag-h --draft=false
            gh release view tmp-diag-h --json isDraft --jq '"publish 后 draft=\(.isDraft)"'
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/tmp-diag-h" --jq '"tag -> \(.object.sha)"'
            gh release delete tmp-diag-h --yes
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/tmp-diag-h"
            echo "cleaned H/I"
          fi

      - name: 回显 token 可见的 installation 权限
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -D /tmp/h.txt -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}"
          grep -i -E 'x-accepted-github-permissions|x-oauth-scopes|x-github-request-id' /tmp/h.txt || true
