# git-cliff 配置：只负责「从 Conventional Commit 生成变更日志文本」。
#
# 分工契约（与 release-please 严格互斥，避免两个工具抢同一份字节）：
#   - release-please 持有 changelog/CHANGELOG-v0.md 与版本号写入（见
#     release-please-config.json）。它是 PR 与 tag 的唯一驱动方。
#   - git-cliff 只在 .github/workflows/release.yml 的 publish 阶段以
#     `git cliff --latest --strip all` 生成**GitHub Release 正文**，不写仓库文件。
# 因此本文件不配置 output，也不配置任何硬编码仓库 URL：仓库尚无 remote，
# 写死 owner 只会让每条变更日志都带上 404 链接。等 remote 落地后再按需补
# `commit_preprocessors` 的 issue linkify。
#
# .oxfmtignore 已排除 changelog/ 与 release-please 的两份 JSON；cliff.toml 是
# TOML，本来就不在 oxfmt 的 YAML/JSON/Markdown 域内，不会被重排。

[changelog]
# header 与 footer 会被 `--strip all` 去掉，只在整份重新生成时出现。
header = """
# Changelog

本文件由 git-cliff 从 Conventional Commit 历史生成。日常发布由 release-please
维护 changelog/CHANGELOG-v0.md，此处仅作为可复现的生成模板。
"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}\
{% if commit.breaking %} [**BREAKING**]{% endif %}
{%- endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
# 只认 Conventional Commit，其余一律丢弃：本仓库的提交规范强制 type(scope): 主题，
# 放行非规范提交等于让变更日志里出现无法归类的噪声。
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"

# `<!-- N -->` 前缀只用于给分组排序，模板里的 `striptags` 会把它去掉。
# 顺序与 release-please-config.json 的 changelog-sections 保持一致。
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^build", group = "<!-- 6 -->Build System" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^style", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
]

# 版本 tag 形如 v0.2.0（release-please 的 include-component-in-tag 为 false）。
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
