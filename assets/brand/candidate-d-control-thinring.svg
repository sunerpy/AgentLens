<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgentLens brand mark - candidate D: DELIBERATE NEGATIVE CONTROL. Do not ship.
  Encodes every failure mode the 16x16 constraint is meant to catch:
    * hairline 8px / 6px strokes on a 1024 master (= 0.125px / 0.09px at 16x16)
    * a two-stop gradient instead of a flat accent
    * no opaque plate, so the mark must survive on the host background alone
  It exists so the audit script can be shown rejecting something on concrete thresholds.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <!-- hairline outer ring -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#grad)" stroke-width="8"/>
  <!-- hairline inner ring -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#grad)" stroke-width="6"/>
  <!-- tiny gradient pupil -->
  <circle cx="512" cy="512" r="90" fill="url(#grad)"/>
  <!-- hairline radial ticks -->
  <g stroke="url(#grad)" stroke-width="6" fill="none">
    <line x1="512" y1="52" x2="512" y2="132"/>
    <line x1="512" y1="892" x2="512" y2="972"/>
    <line x1="52" y1="512" x2="132" y2="512"/>
    <line x1="892" y1="512" x2="972" y2="512"/>
  </g>
</svg>
